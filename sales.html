<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediStock Cloud — Sell</title>
<style>
  :root{
    --bg:#f4f7f5; --card:#ffffff; --text:#152420; --muted:#4b5f59;
    --accent:#0f6b5c; --accent2:#2e7d32; --warn:#c97a1f; --danger:#b23b3b; --border:#dbe4e0;
  }
  html[data-theme="dark"]{
    --bg:#0d1614; --card:#16211d; --text:#e7f2ee; --muted:#9fb6ae;
    --accent:#2bbfa0; --accent2:#4fd07a; --warn:#e2a53d; --danger:#e2685f; --border:#2a3934;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px; padding-bottom:40px;
  }
  h1{font-size:19px; margin:0;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; background:var(--border); color:var(--muted);}
  .badge.online{color:var(--accent2);} .badge.offline{color:var(--danger);}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:15px; margin:0 0 10px; color:var(--accent); font-weight:700;}
  label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px;}
  input, select{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:14px;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  .row{display:flex; gap:8px;} .row > *{flex:1;}
  button{border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff; width:100%; padding:12px;}
  .result-item{
    padding:10px; border-bottom:1px solid var(--border); cursor:pointer;
  }
  .result-item:last-child{border-bottom:none;}
  .result-item:active{background:var(--border);}
  .result-name{font-weight:600; font-size:14px;}
  .result-stock{font-size:12px; color:var(--muted);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px 0;}
  .selected-card{border:1px solid var(--accent);}
  .total-line{font-size:20px; font-weight:700; text-align:right; margin-top:12px;}
  .hint{font-size:11px; color:var(--muted); margin-top:6px;}
  .hidden{display:none !important;}
  .link{color:var(--accent); font-size:13px; text-decoration:none;}

  /* ===== Shared MediStock Cloud navigation (matches MediStock Pro) ===== */
  .app-header{
    position:sticky; top:0; z-index:20;
    background:var(--accent); color:#fff;
    margin:-16px -16px 14px; padding:16px 18px 14px;
  }
  .app-header h1{margin:0; font-size:19px; letter-spacing:.2px; font-weight:700; color:#fff;}
  .app-header p{margin:2px 0 0; font-size:12.5px; color:rgba(255,255,255,.75);}
  .nav-bar{
    position:sticky; top:0; z-index:25;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--accent); color:#fff;
    margin:-14px -16px 14px; padding:8px 6px; border-top:1px solid rgba(255,255,255,.15);
  }
  .hamburger-btn{
    background:none; border:none; color:#fff; font-size:22px; line-height:1;
    padding:8px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .nav-bar-brand{
    font-size:14px; font-weight:600; color:#fff; cursor:pointer;
    padding:8px 10px; -webkit-tap-highlight-color:transparent;
  }
  .nav-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:29;}
  .nav-overlay.visible{display:block;}
  .nav-panel{
    position:fixed; top:0; bottom:0; right:0; z-index:30;
    width:78%; max-width:300px;
    background:var(--accent);
    display:flex; flex-direction:column; gap:4px;
    padding:16px 10px; overflow-y:auto;
    transform:translateX(105%);
    transition:transform .22s ease;
    box-shadow:0 0 20px rgba(0,0,0,.3);
  }
  .nav-panel.open{transform:translateX(0);}
  .nav-panel-title{
    color:rgba(255,255,255,.75); font-size:12px; text-transform:uppercase; letter-spacing:.5px;
    margin:4px 6px 6px;
  }
  .nav-panel a{
    display:block; background:rgba(255,255,255,.1); color:#fff;
    border:1px solid rgba(255,255,255,.2); padding:12px 14px; margin-bottom:4px;
    border-radius:10px; font-size:14.5px; font-weight:600; text-align:left;
    text-decoration:none;
  }
  .nav-panel a.active{background:var(--card); color:var(--accent);}
  .nav-panel .theme-toggle{
    margin-top:10px; background:rgba(255,255,255,.1); color:#fff;
    border:1px solid rgba(255,255,255,.2); padding:10px 14px; border-radius:10px;
    font-size:13px; font-weight:600; cursor:pointer; text-align:left; width:100%;
  }
</style>
<script>
(function(){
  try{
    var pref = localStorage.getItem('mcThemePreference') || 'auto';
    var isDark = pref==='dark' || (pref==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  }catch(e){}
})();
</script>
</head>
<body>

<header class="app-header">
  <h1>MediStock Cloud</h1>
  <p>Multi-Shop Edition · Sell</p>
</header>
<div class="nav-bar">
  <button class="hamburger-btn" id="navToggle" aria-label="Menu" type="button">&#9776;</button>
  <div class="nav-bar-brand" onclick="location.href='dashboard.html'">🏠 Home</div>
  <span class="badge" id="netBadge">checking…</span>
</div>
<div class="nav-overlay" id="navOverlay"></div>
<nav class="nav-panel" id="navPanel">
  <div class="nav-panel-title">Menu</div>
  <a href="dashboard.html">Dashboard</a>
  <a href="sales.html" class="active">Sell</a>
  <a href="inventory.html">Inventory</a>
  <a href="purchases.html">Purchases</a>
  <a href="batches.html">Batches</a>
  <a href="stocktake.html">Stock Taking</a>
  <a href="whattobuy.html">What to Buy</a>
  <a href="expenses.html">Expenses</a>
  <a href="credit.html">Credit / Loans</a>
  <a href="suppliers.html">Suppliers</a>
  <a href="shops.html">Shops</a>
  <button type="button" class="theme-toggle" id="themeToggle">Theme</button>
</nav>
<div class="hint" id="shopIndicator" style="margin-bottom:8px;"></div>

<div class="card" id="searchCard">
  <input type="text" id="searchBox" placeholder="Search drug to sell…" autocomplete="off">
  <div id="results" style="margin-top:8px;"></div>
</div>

<div class="card hidden selected-card" id="sellCard">
  <h2 id="sellDrugName">—</h2>
  <div class="hint" id="sellDrugStock"></div>

  <label>Sell by</label>
  <select id="unitLevel"></select>

  <label>Quantity</label>
  <input type="number" id="qty" min="1" value="1">

  <div class="hint" id="stockCheckMsg"></div>
  <div class="total-line" id="totalLine">Total: 0</div>

  <button class="btn-primary" onclick="completeSale()">Record Sale</button>
  <div id="saleStatus" style="font-size:13px; margin-top:8px;"></div>
</div>

<script>
  (function(){
    var toggle = document.getElementById('navToggle');
    var panel = document.getElementById('navPanel');
    var overlay = document.getElementById('navOverlay');
    function closeNav(){ panel.classList.remove('open'); overlay.classList.remove('visible'); }
    function openNav(){ panel.classList.add('open'); overlay.classList.add('visible'); }
    toggle && toggle.addEventListener('click', function(){
      panel.classList.contains('open') ? closeNav() : openNav();
    });
    overlay && overlay.addEventListener('click', closeNav);

    var themeBtn = document.getElementById('themeToggle');
    var order = ['auto','light','dark'];
    var labels = {auto:'\ud83c\udf13 Theme: Auto', light:'\u2600\ufe0f Theme: Light', dark:'\ud83c\udf19 Theme: Dark'};
    function applyPref(pref){
      var isDark = pref==='dark' || (pref==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      if (themeBtn) themeBtn.textContent = labels[pref];
    }
    var current = localStorage.getItem('mcThemePreference') || 'auto';
    applyPref(current);
    themeBtn && themeBtn.addEventListener('click', function(){
      current = order[(order.indexOf(current)+1) % order.length];
      localStorage.setItem('mcThemePreference', current);
      applyPref(current);
    });
  })();
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, getDocs, updateDoc, writeBatch, collection, addDoc, onSnapshot,
    enableIndexedDbPersistence, serverTimestamp, query, where
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXwKfb9yg3HAQFIPG6q3SYHU9C7FQvkNY",
    authDomain: "medistock-cloud-93b83.firebaseapp.com",
    projectId: "medistock-cloud-93b83",
    storageBucket: "medistock-cloud-93b83.firebasestorage.app",
    messagingSenderId: "615610747921",
    appId: "1:615610747921:web:94b6627b64a250362335b0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  let currentUser = null;
  let currentBusinessId = null;
  let currentShopId = null;
  let allDrugs = [];
  let selectedDrug = null;
  let selectedBatches = []; // active, non-expired batches for selectedDrug, earliest expiry first
  let sellableBase = 0;     // stock actually available to sell right now

  function daysUntil(dateStr) {
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr);
    return Math.round((target - today) / 86400000);
  }

  const PackagingEngine = {
    baseToBreakdown(baseQty, baseUnitsPerStock, basePerIntermediate) {
      baseUnitsPerStock = Number(baseUnitsPerStock) || 0;
      basePerIntermediate = Number(basePerIntermediate) || 0;
      let stockUnits = 0, remainder = baseQty;
      if (baseUnitsPerStock > 0) {
        stockUnits = Math.floor(baseQty / baseUnitsPerStock);
        remainder = baseQty - stockUnits * baseUnitsPerStock;
      }
      let intermediateUnits = 0, looseBase = remainder;
      if (basePerIntermediate > 0) {
        intermediateUnits = Math.floor(remainder / basePerIntermediate);
        looseBase = remainder - intermediateUnits * basePerIntermediate;
      }
      return { stockUnits, intermediateUnits, looseBase };
    },
    unitQuantityToBase(qty, unitLevel, baseUnitsPerStock, basePerIntermediate) {
      if (unitLevel === "stock") return qty * (Number(baseUnitsPerStock) || 0);
      if (unitLevel === "intermediate") return qty * (Number(basePerIntermediate) || 0);
      return qty; // base
    }
  };

  function stockSummary(d) {
    const b = PackagingEngine.baseToBreakdown(d.currentStockBase, d.baseUnitsPerStock, d.basePerIntermediate);
    const parts = [];
    if (b.stockUnits) parts.push(`${b.stockUnits} ${d.stockUnit}(s)`);
    if (d.hasIntermediate && b.intermediateUnits) parts.push(`${b.intermediateUnits} ${d.intermediateUnit}(s)`);
    if (b.looseBase) parts.push(`${b.looseBase} ${d.baseUnit}(s)`);
    return parts.length ? parts.join(", ") : `0 ${d.baseUnit}(s)`;
  }

  function renderResults(filterText) {
    const box = document.getElementById("results");
    if (!filterText) { box.innerHTML = ""; return; }
    const matches = allDrugs.filter(d => d.name.toLowerCase().includes(filterText.toLowerCase()));
    if (matches.length === 0) {
      box.innerHTML = '<div class="empty">No matching drug in stock.</div>';
      return;
    }
    box.innerHTML = matches.map(d => `
      <div class="result-item" onclick="selectDrug('${d.id}')">
        <div class="result-name">${d.name}</div>
        <div class="result-stock">${stockSummary(d)}</div>
      </div>`).join("");
  }
  document.getElementById("searchBox").addEventListener("input", (e) => renderResults(e.target.value));

  window.selectDrug = async function (id) {
    selectedDrug = allDrugs.find(d => d.id === id);
    if (!selectedDrug) return;
    document.getElementById("searchBox").value = selectedDrug.name;
    document.getElementById("results").innerHTML = "";
    document.getElementById("sellCard").classList.remove("hidden");
    document.getElementById("sellDrugName").textContent = selectedDrug.name;
    document.getElementById("sellDrugStock").textContent = "Checking batches…";

    const batchesQ = query(collection(db, "batches"), where("drugId", "==", selectedDrug.id), where("ownerUid", "==", currentUser.uid));
    const snap = await getDocs(batchesQ);
    const allBatchesForDrug = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    if (allBatchesForDrug.length === 0) {
      // No batches recorded for this drug yet — fall back to the simple
      // total on the drug record itself (unchanged behavior).
      selectedBatches = [];
      sellableBase = selectedDrug.currentStockBase;
      document.getElementById("sellDrugStock").textContent = "In stock: " + stockSummary(selectedDrug);
    } else {
      const active = allBatchesForDrug
        .filter(b => daysUntil(b.expiryDate) >= 0 && b.quantity > 0)
        .sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate));
      const expiredQty = allBatchesForDrug
        .filter(b => daysUntil(b.expiryDate) < 0)
        .reduce((sum, b) => sum + b.quantity, 0);

      selectedBatches = active;
      sellableBase = active.reduce((sum, b) => sum + b.quantity, 0);

      const breakdown = PackagingEngine.baseToBreakdown(sellableBase, selectedDrug.baseUnitsPerStock, selectedDrug.basePerIntermediate);
      const parts = [];
      if (breakdown.stockUnits) parts.push(`${breakdown.stockUnits} ${selectedDrug.stockUnit}(s)`);
      if (selectedDrug.hasIntermediate && breakdown.intermediateUnits) parts.push(`${breakdown.intermediateUnits} ${selectedDrug.intermediateUnit}(s)`);
      if (breakdown.looseBase) parts.push(`${breakdown.looseBase} ${selectedDrug.baseUnit}(s)`);
      let stockText = parts.length ? parts.join(", ") : `0 ${selectedDrug.baseUnit}(s)`;
      if (expiredQty > 0) stockText += ` (+${expiredQty} ${selectedDrug.baseUnit}(s) expired, excluded)`;
      const nextExpiry = active.length ? ` · next batch expires ${active[0].expiryDate}` : "";
      document.getElementById("sellDrugStock").textContent = "Sellable: " + stockText + nextExpiry;
    }

    const unitSel = document.getElementById("unitLevel");
    const options = [];
    options.push(`<option value="base">${selectedDrug.baseUnit} (base unit) — ${selectedDrug.retailBase || 0} each</option>`);
    if (selectedDrug.hasIntermediate) {
      options.push(`<option value="intermediate">${selectedDrug.intermediateUnit} — ${selectedDrug.retailIntermediate || 0} each</option>`);
    }
    options.push(`<option value="stock">${selectedDrug.stockUnit} — ${selectedDrug.retailStock || 0} each</option>`);
    unitSel.innerHTML = options.join("");
    document.getElementById("qty").value = 1;
    document.getElementById("saleStatus").textContent = "";
    updateTotal();
  };

  function priceFor(unitLevel) {
    if (unitLevel === "stock") return Number(selectedDrug.retailStock) || 0;
    if (unitLevel === "intermediate") return Number(selectedDrug.retailIntermediate) || 0;
    return Number(selectedDrug.retailBase) || 0;
  }

  function updateTotal() {
    if (!selectedDrug) return;
    const unitLevel = document.getElementById("unitLevel").value;
    const qty = Number(document.getElementById("qty").value) || 0;
    const baseQtyNeeded = PackagingEngine.unitQuantityToBase(qty, unitLevel, selectedDrug.baseUnitsPerStock, selectedDrug.basePerIntermediate);
    const total = qty * priceFor(unitLevel);
    document.getElementById("totalLine").textContent = "Total: " + total.toLocaleString();

    const msgEl = document.getElementById("stockCheckMsg");
    if (baseQtyNeeded > sellableBase) {
      msgEl.textContent = `Not enough sellable stock available for this quantity.`;
      msgEl.style.color = "var(--danger)";
    } else {
      msgEl.textContent = "";
    }
  }
  document.getElementById("unitLevel").addEventListener("change", updateTotal);
  document.getElementById("qty").addEventListener("input", updateTotal);

  window.completeSale = async function () {
    const statusEl = document.getElementById("saleStatus");
    if (!selectedDrug) return;
    const unitLevel = document.getElementById("unitLevel").value;
    const qty = Number(document.getElementById("qty").value) || 0;
    if (qty <= 0) { statusEl.textContent = "Enter a quantity."; statusEl.style.color = "var(--danger)"; return; }

    const baseQtyNeeded = PackagingEngine.unitQuantityToBase(qty, unitLevel, selectedDrug.baseUnitsPerStock, selectedDrug.basePerIntermediate);
    if (baseQtyNeeded > sellableBase) {
      statusEl.textContent = "Not enough sellable stock for this sale.";
      statusEl.style.color = "var(--danger)";
      return;
    }
    const total = qty * priceFor(unitLevel);

    try {
      statusEl.textContent = "Saving…"; statusEl.style.color = "var(--muted)";
      const batch = writeBatch(db);
      let batchesUsed = [];

      if (selectedBatches.length > 0) {
        // FEFO: take from the earliest-expiring batch(es) first, splitting
        // across batches if one alone doesn't cover the quantity.
        let remaining = baseQtyNeeded;
        for (const b of selectedBatches) {
          if (remaining <= 0) break;
          const take = Math.min(remaining, b.quantity);
          if (take <= 0) continue;
          batch.update(doc(db, "batches", b.id), { quantity: b.quantity - take });
          batchesUsed.push({ batchId: b.id, batchNumber: b.batchNumber || "", qty: take });
          remaining -= take;
        }
        const newStockBase = selectedDrug.currentStockBase - baseQtyNeeded;
        batch.update(doc(db, "drugs", selectedDrug.id), { currentStockBase: newStockBase });
        selectedDrug.currentStockBase = newStockBase;
      } else {
        // No batches recorded for this drug — simple direct deduction, same as before.
        const newStockBase = selectedDrug.currentStockBase - baseQtyNeeded;
        batch.update(doc(db, "drugs", selectedDrug.id), { currentStockBase: newStockBase });
        selectedDrug.currentStockBase = newStockBase;
      }

      await batch.commit();

      await addDoc(collection(db, "sales"), {
        businessId: currentBusinessId,
        shopId: currentShopId,
        ownerUid: currentUser.uid,
        drugId: selectedDrug.id,
        drugName: selectedDrug.name,
        unitLevel,
        qty,
        baseQtyDeducted: baseQtyNeeded,
        batchesUsed,
        pricePerUnit: priceFor(unitLevel),
        total,
        createdAt: serverTimestamp()
      });

      statusEl.textContent = `Sale recorded — Total ${total.toLocaleString()}`;
      statusEl.style.color = "var(--accent2)";
      sellableBase -= baseQtyNeeded;
      selectedBatches = selectedBatches.map(b => {
        const used = batchesUsed.find(u => u.batchId === b.id);
        return used ? { ...b, quantity: b.quantity - used.qty } : b;
      }).filter(b => b.quantity > 0);
      document.getElementById("sellDrugStock").textContent = "Sellable: " + stockSummary({ ...selectedDrug, currentStockBase: sellableBase });
      document.getElementById("qty").value = 1;
      updateTotal();
    } catch (err) {
      statusEl.textContent = "Failed: " + err.message;
      statusEl.style.color = "var(--danger)";
    }
  };

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    currentUser = user;
    const userSnap = await getDoc(doc(db, "users", user.uid));
    if (!userSnap.exists()) { window.location.href = "login.html"; return; }
    currentBusinessId = userSnap.data().businessId;

    const shopsSnap = await getDocs(query(collection(db, "shops"), where("ownerUid", "==", user.uid)));
    const activeId = localStorage.getItem("mc_activeShopId");
    const foundShop = shopsSnap.docs.find(d => d.id === activeId);
    const resolvedShopDoc = foundShop || (shopsSnap.empty ? null : shopsSnap.docs[0]);
    currentShopId = resolvedShopDoc ? resolvedShopDoc.id : null;
    document.getElementById("shopIndicator").textContent = resolvedShopDoc
      ? `Working in: ${resolvedShopDoc.data().name}`
      : "No shop set up yet — go to Shops to add one.";

    const drugsQ = query(collection(db, "drugs"), where("ownerUid", "==", user.uid), where("shopId", "==", currentShopId));
    onSnapshot(drugsQ, { includeMetadataChanges: true }, (snap) => {
      const badge = document.getElementById("netBadge");
      const fromCache = snap.metadata.fromCache;
      badge.textContent = fromCache ? "offline (cached)" : "online (synced)";
      badge.className = "badge " + (fromCache ? "offline" : "online");
      allDrugs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
      if (document.getElementById("searchBox").value) renderResults(document.getElementById("searchBox").value);
    });
  });
</script>
</body>
</html>
