<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediStock Cloud — Sell</title>
<style>
  :root{
    --bg:#f4f7f5; --card:#ffffff; --text:#152420; --muted:#4b5f59;
    --accent:#0f6b5c; --accent2:#2e7d32; --warn:#c97a1f; --danger:#b23b3b; --border:#dbe4e0;
  }
  html[data-theme="dark"]{
    --bg:#0d1614; --card:#16211d; --text:#e7f2ee; --muted:#9fb6ae;
    --accent:#2bbfa0; --accent2:#4fd07a; --warn:#e2a53d; --danger:#e2685f; --border:#2a3934;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px; padding-bottom:40px;
  }
  h1{font-size:19px; margin:0;}
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; background:var(--border); color:var(--muted);}
  .badge.online{color:var(--accent2);} .badge.offline{color:var(--danger);}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:15px; margin:0 0 10px; color:var(--accent); font-weight:700;}
  label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px;}
  input, select, textarea{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:14px; font-family:inherit;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  .row{display:flex; gap:8px;} .row > *{flex:1;}
  .chk{display:flex; align-items:center; gap:8px; margin:10px 0;}
  .chk input{width:auto;}
  button{border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff; width:100%; padding:12px; margin-top:10px;}
  .btn-secondary{background:transparent; color:var(--accent); border:1px solid var(--accent); width:100%; padding:10px; margin-top:8px;}
  .btn-danger-outline{background:transparent; border:1px solid var(--danger); color:var(--danger);}
  .btn-small{width:auto; padding:7px 12px; font-size:12.5px;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:8px 12px; border-radius:999px; font-size:13px; cursor:pointer;
  }
  .pill-row{display:flex; gap:8px; flex-wrap:wrap;}
  .pill-btn{
    display:flex; align-items:center; gap:8px;
    background:transparent; border:1px solid var(--border); color:var(--text);
    padding:9px 14px; border-radius:999px; font-size:13.5px; font-weight:500; cursor:pointer;
  }
  .pill-btn .dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--muted); flex-shrink:0;}
  .pill-btn.selected{border-color:var(--accent); color:var(--accent); font-weight:700;}
  .pill-btn.selected .dot{border-color:var(--accent); background:var(--accent);}
  .result-item{padding:10px; border-bottom:1px solid var(--border); cursor:pointer;}
  .result-item:last-child{border-bottom:none;}
  .result-item:active{background:var(--bg);}
  .result-name{font-weight:600; font-size:14px;}
  .result-stock{font-size:12px; color:var(--muted);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px 0;}
  .selected-card{border:1px solid var(--accent);}
  .total-line{font-size:20px; font-weight:700; text-align:right; margin-top:12px;}
  .hint{font-size:11px; color:var(--muted); margin-top:6px;}
  .hidden{display:none !important;}
  .cart-item{display:flex; justify-content:space-between; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border); gap:8px;}
  .cart-item:last-child{border-bottom:none;}
  .cart-item-name{font-weight:600; font-size:14px;}
  .cart-item-meta{font-size:12px; color:var(--muted);}
  .receipt-box{
    font-family:monospace; font-size:12.5px; white-space:pre-wrap; background:var(--bg);
    border:1px solid var(--border); border-radius:8px; padding:12px; line-height:1.6;
  }

  /* ===== Shared MediStock Cloud navigation ===== */
  .app-header{
    position:sticky; top:0; z-index:20;
    background:var(--accent); color:#fff;
    margin:-16px -16px 14px; padding:16px 18px 14px;
  }
  .app-header h1{margin:0; font-size:19px; letter-spacing:.2px; font-weight:700; color:#fff;}
  .app-header p{margin:2px 0 0; font-size:12.5px; color:rgba(255,255,255,.75);}
  .nav-bar{
    position:sticky; top:0; z-index:25;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--accent); color:#fff;
    margin:-14px -16px 14px; padding:8px 6px; border-top:1px solid rgba(255,255,255,.15);
  }
  .hamburger-btn{
    background:none; border:none; color:#fff; font-size:22px; line-height:1;
    padding:8px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .nav-bar-brand{
    font-size:14px; font-weight:600; color:#fff; cursor:pointer;
    padding:8px 10px; -webkit-tap-highlight-color:transparent;
  }
  .nav-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:29;}
  .nav-overlay.visible{display:block;}
  .nav-panel{
    position:fixed; top:0; bottom:0; right:0; z-index:30;
    width:78%; max-width:300px;
    background:var(--accent);
    display:flex; flex-direction:column; gap:4px;
    padding:16px 10px; overflow-y:auto;
    transform:translateX(105%);
    transition:transform .22s ease;
    box-shadow:0 0 20px rgba(0,0,0,.3);
  }
  .nav-panel.open{transform:translateX(0);}
  .nav-panel-title{
    color:rgba(255,255,255,.75); font-size:12px; text-transform:uppercase; letter-spacing:.5px;
    margin:4px 6px 6px;
  }
  .nav-panel a{
    display:block; background:rgba(255,255,255,.1); color:#fff;
    border:1px solid rgba(255,255,255,.2); padding:12px 14px; margin-bottom:4px;
    border-radius:10px; font-size:14.5px; font-weight:600; text-align:left;
    text-decoration:none;
  }
  .nav-panel a.active{background:var(--card); color:var(--accent);}
  .nav-panel .theme-toggle{
    margin-top:10px; background:rgba(255,255,255,.1); color:#fff;
    border:1px solid rgba(255,255,255,.2); padding:10px 14px; border-radius:10px;
    font-size:13px; font-weight:600; cursor:pointer; text-align:left; width:100%;
  }
</style>
<script>
(function(){
  try{
    var pref = localStorage.getItem('mcThemePreference') || 'auto';

<script>
  (function(){
    var toggle = document.getElementById('navToggle');
    var panel = document.getElementById('navPanel');
    var overlay = document.getElementById('navOverlay');
    function closeNav(){ panel.classList.remove('open'); overlay.classList.remove('visible'); }
    function openNav(){ panel.classList.add('open'); overlay.classList.add('visible'); }
    toggle && toggle.addEventListener('click', function(){
      panel.classList.contains('open') ? closeNav() : openNav();
    });
    overlay && overlay.addEventListener('click', closeNav);

    var themeBtn = document.getElementById('themeToggle');
    var order = ['auto','light','dark'];
    var labels = {auto:'\ud83c\udf13 Theme: Auto', light:'\u2600\ufe0f Theme: Light', dark:'\ud83c\udf19 Theme: Dark'};
    function applyPref(pref){
      var isDark = pref==='dark' || (pref==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      if (themeBtn) themeBtn.textContent = labels[pref];
    }
    var current = localStorage.getItem('mcThemePreference') || 'auto';
    applyPref(current);
    themeBtn && themeBtn.addEventListener('click', function(){
      current = order[(order.indexOf(current)+1) % order.length];
      localStorage.setItem('mcThemePreference', current);
      applyPref(current);
    });
  })();
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, getDocs, writeBatch, runTransaction, collection, addDoc,
    onSnapshot, enableIndexedDbPersistence, serverTimestamp, query, where
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXwKfb9yg3HAQFIPG6q3SYHU9C7FQvkNY",
    authDomain: "medistock-cloud-93b83.firebaseapp.com",
    projectId: "medistock-cloud-93b83",
    storageBucket: "medistock-cloud-93b83.firebasestorage.app",
    messagingSenderId: "615610747921",
    appId: "1:615610747921:web:94b6627b64a250362335b0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  let currentUser = null;
  let currentRole = null;
  let cashierName = "";
  let currentBusinessId = null;
  let currentShopId = null;
  let currentShopName = "";
  let businessName = "";
  let businessPhone = "";
  let allDrugs = [];
  let creditAccounts = [];
  let selectedDrug = null;
  let selectedUnitLevel = "base";
  let editingCartIndex = null; // null = adding new; index = editing that cart line
  let selectedBatches = []; // active, non-expired batches for selectedDrug, earliest expiry first
  let sellableBaseForDrug = 0; // stock actually available right now, before cart reservations
  let cart = []; // { drugId, drugName, drugClass, unitLevel, unitLabel, qty, baseQtyNeeded, pricePerUnit, total, baseUnitsPerStock, basePerIntermediate, stockUnit, intermediateUnit, baseUnit }
  let lastReceiptData = null;

  function daysUntil(dateStr) {
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr);
    return Math.round((target - today) / 86400000);
  }

  const PackagingEngine = {
    baseToBreakdown(baseQty, baseUnitsPerStock, basePerIntermediate) {
      baseUnitsPerStock = Number(baseUnitsPerStock) || 0;
      basePerIntermediate = Number(basePerIntermediate) || 0;
      let stockUnits = 0, remainder = baseQty;
      if (baseUnitsPerStock > 0) {
        stockUnits = Math.floor(baseQty / baseUnitsPerStock);
        remainder = baseQty - stockUnits * baseUnitsPerStock;
      }
      let intermediateUnits = 0, looseBase = remainder;
      if (basePerIntermediate > 0) {
        intermediateUnits = Math.floor(remainder / basePerIntermediate);
        looseBase = remainder - intermediateUnits * basePerIntermediate;
      }
      return { stockUnits, intermediateUnits, looseBase };
    },
    unitQuantityToBase(qty, unitLevel, baseUnitsPerStock, basePerIntermediate) {
      if (unitLevel === "stock") return qty * (Number(baseUnitsPerStock) || 0);
      if (unitLevel === "intermediate") return qty * (Number(basePerIntermediate) || 0);
      return qty; // base
    }
  };

  function stockSummary(d) {
    const b = PackagingEngine.baseToBreakdown(d.currentStockBase, d.baseUnitsPerStock, d.basePerIntermediate);
    const parts = [];
    if (b.stockUnits) parts.push(`${b.stockUnits} ${d.stockUnit}(s)`);
    if (d.hasIntermediate && b.intermediateUnits) parts.push(`${b.intermediateUnits} ${d.intermediateUnit}(s)`);
    if (b.looseBase) parts.push(`${b.looseBase} ${d.baseUnit}(s)`);
    return parts.length ? parts.join(", ") : `0 ${d.baseUnit}(s)`;
  }
  // The clearest unit combination for a SOLD quantity, e.g. "5 Strip(s)"
  // rather than "50 Tablet(s)" — used consistently on the cart and receipt.
  function formatSoldQtyLabel(baseQty, drug) {
    const b = PackagingEngine.baseToBreakdown(baseQty, drug.baseUnitsPerStock, drug.basePerIntermediate);
    const parts = [];
    if (b.stockUnits) parts.push(`${b.stockUnits} ${drug.stockUnit}(s)`);
    if (drug.hasIntermediate && b.intermediateUnits) parts.push(`${b.intermediateUnits} ${drug.intermediateUnit}(s)`);
    if (b.looseBase) parts.push(`${b.looseBase} ${drug.baseUnit}(s)`);
    return parts.length ? parts.join(" + ") : `0 ${drug.baseUnit}(s)`;
  }

  function unitLabelFor(unitLevel, drug) {
    if (unitLevel === "stock") return drug.stockUnit;
    if (unitLevel === "intermediate") return drug.intermediateUnit;
    return drug.baseUnit;
  }

  // Pro's display convention: show the sold quantity converted into its
  // clearest unit (e.g. "1 Strip(s)"), and only if that differs from what
  // was actually keyed in, add a muted "(sold as 10 Tablet(s) x 50)" line
  // underneath showing the real entered qty/unit/price.
  function cartLineDisplay(c) {
    const convertedLabel = formatSoldQtyLabel(c.baseQtyNeeded, c);
    const rawLabel = `${c.qty} ${c.unitLabel}(s)`;
    const sameAsRaw = convertedLabel === rawLabel;
    return {
      topLine: `${convertedLabel} = ${c.total.toLocaleString()}`,
      subLine: sameAsRaw ? null : `(sold as ${c.qty} ${c.unitLabel}(s) × ${c.pricePerUnit.toLocaleString()})`
    };
  }
  function priceFor(unitLevel, drug) {
    if (unitLevel === "stock") return Number(drug.retailStock) || 0;
    if (unitLevel === "intermediate") return Number(drug.retailIntermediate) || 0;
    return Number(drug.retailBase) || 0;
  }

  function cartReservedBaseFor(drugId, excludeIndex) {
    return cart
      .filter((c, idx) => c.drugId === drugId && idx !== excludeIndex)
      .reduce((sum, c) => sum + c.baseQtyNeeded, 0);
  }

  function renderResults(filterText) {
    const box = document.getElementById("results");
    if (!filterText) { box.innerHTML = ""; return; }
    const f = filterText.toLowerCase();
    const matches = allDrugs.filter(d => d.active !== false && (
      d.name.toLowerCase().includes(f) ||
      (d.generic || "").toLowerCase().includes(f) ||
      (d.drugClass || "").toLowerCase().includes(f)
    ));
    if (matches.length === 0) {
      box.innerHTML = '<div class="empty">No matching drug in stock.</div>';
      return;
    }
    box.innerHTML = matches.map(d => `
      <div class="result-item" onclick="selectDrug('${d.id}')">
        <div class="result-name">${d.name}</div>
        <div class="result-stock">${stockSummary(d)}</div>
      </div>`).join("");
  }
  document.getElementById("searchBox").addEventListener("input", (e) => renderResults(e.target.value));

  window.selectDrug = async function (id, prefillFromCartIndex) {
    selectedDrug = allDrugs.find(d => d.id === id);
    if (!selectedDrug) return;
    editingCartIndex = (prefillFromCartIndex !== undefined) ? prefillFromCartIndex : null;
    document.getElementById("addToCartBtn").textContent = editingCartIndex !== null ? "Save Changes" : "Add to Cart";
    document.getElementById("searchBox").value = "";
    document.getElementById("results").innerHTML = "";
    document.getElementById("configureCard").classList.remove("hidden");
    document.getElementById("configDrugName").textContent = selectedDrug.name;
    document.getElementById("configDrugStock").textContent = "Checking batches…";
    window.scrollTo({ top: document.getElementById("configureCard").offsetTop - 10, behavior: "smooth" });

    const batchesQ = query(
      collection(db, "batches"),
      where("businessId", "==", currentBusinessId),
      where("shopId", "==", currentShopId),
      where("drugId", "==", selectedDrug.id)
    );
    const snap = await getDocs(batchesQ);
    const allBatchesForDrug = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    const reserved = cartReservedBaseFor(selectedDrug.id, editingCartIndex);

    if (allBatchesForDrug.length === 0) {
      selectedBatches = [];
      sellableBaseForDrug = selectedDrug.currentStockBase;
      document.getElementById("configDrugStock").textContent =
        "In stock: " + stockSummary(selectedDrug) + (reserved ? ` (${formatSoldQtyLabel(reserved, selectedDrug)} already in cart)` : "");
    } else {
      const active = allBatchesForDrug
        .filter(b => daysUntil(b.expiryDate) >= 0 && b.quantity > 0)
        .sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate));
      const expiredQty = allBatchesForDrug
        .filter(b => daysUntil(b.expiryDate) < 0)
        .reduce((sum, b) => sum + b.quantity, 0);

      selectedBatches = active;
      sellableBaseForDrug = active.reduce((sum, b) => sum + b.quantity, 0);

      let stockText = "Sellable: " + formatSoldQtyLabel(sellableBaseForDrug, selectedDrug);
      if (expiredQty > 0) stockText += ` (+${expiredQty} ${selectedDrug.baseUnit}(s) expired, excluded)`;
      if (reserved > 0) stockText += ` — ${formatSoldQtyLabel(reserved, selectedDrug)} already in cart`;
      const nextExpiry = active.length ? ` · next batch expires ${active[0].expiryDate}` : "";
      document.getElementById("configDrugStock").textContent = stockText + nextExpiry;
    }

    const existing = editingCartIndex !== null ? cart[editingCartIndex] : null;
    selectedUnitLevel = existing ? existing.unitLevel : "base";
    renderUnitLevelPills();
    document.getElementById("qty").value = existing ? existing.qty : "";
    document.getElementById("pricePerUnit").value = existing ? existing.pricePerUnit : priceFor(selectedUnitLevel, selectedDrug);
    updateConfigTotal();
  };

  function renderUnitLevelPills() {
    const options = [{ level: "stock", label: selectedDrug.stockUnit }];
    if (selectedDrug.hasIntermediate) options.push({ level: "intermediate", label: selectedDrug.intermediateUnit });
    options.push({ level: "base", label: selectedDrug.baseUnit });
    document.getElementById("unitLevelPills").innerHTML = options.map(o => `
      <button type="button" class="pill-btn ${selectedUnitLevel === o.level ? "selected" : ""}" onclick="selectUnitLevel('${o.level}')">
        <span class="dot"></span>${o.label}
      </button>`).join("");
    document.getElementById("priceLabel").textContent = `Price per ${options.find(o => o.level === selectedUnitLevel).label}`;
  }

  window.selectUnitLevel = function (level) {
    selectedUnitLevel = level;
    renderUnitLevelPills();
    // Only default the price to the drug's list price when adding fresh —
    // don't clobber a price the user already typed while editing.
    if (editingCartIndex === null) {
      document.getElementById("pricePerUnit").value = priceFor(level, selectedDrug);
    }
    updateConfigTotal();
  };

  document.getElementById("qty").addEventListener("input", updateConfigTotal);
  document.getElementById("pricePerUnit").addEventListener("input", updateConfigTotal);

  function updateConfigTotal() {
    if (!selectedDrug) return;
    const qty = Number(document.getElementById("qty").value) || 0;
    const price = Number(document.getElementById("pricePerUnit").value) || 0;
    const baseQtyNeeded = PackagingEngine.unitQuantityToBase(qty, selectedUnitLevel, selectedDrug.baseUnitsPerStock, selectedDrug.basePerIntermediate);
    const total = qty * price;
    document.getElementById("lineTotal").textContent = "Line total: " + total.toLocaleString();

    const msgEl = document.getElementById("stockCheckMsg");
    const reserved = cartReservedBaseFor(selectedDrug.id, editingCartIndex);
    if (baseQtyNeeded + reserved > sellableBaseForDrug) {
      msgEl.textContent = "Not enough sellable stock available for this quantity (accounting for what's already in the cart).";
      msgEl.style.color = "var(--danger)";
    } else {
      msgEl.textContent = "";
    }
  }

  window.closeConfigure = function () {
    selectedDrug = null;
    editingCartIndex = null;
    document.getElementById("configureCard").classList.add("hidden");
  };

  window.addToCart = function () {
    if (!selectedDrug) return;
    const qty = Number(document.getElementById("qty").value) || 0;
    const price = Number(document.getElementById("pricePerUnit").value) || 0;
    if (qty <= 0) { alert("Enter a quantity."); return; }
    const baseQtyNeeded = PackagingEngine.unitQuantityToBase(qty, selectedUnitLevel, selectedDrug.baseUnitsPerStock, selectedDrug.basePerIntermediate);
    const reserved = cartReservedBaseFor(selectedDrug.id, editingCartIndex);
    if (baseQtyNeeded + reserved > sellableBaseForDrug) {
      alert("Not enough sellable stock for this quantity.");
      return;
    }
    const line = {
      drugId: selectedDrug.id, drugName: selectedDrug.name, drugClass: selectedDrug.drugClass || "",
      unitLevel: selectedUnitLevel, unitLabel: unitLabelFor(selectedUnitLevel, selectedDrug), qty, baseQtyNeeded,
      pricePerUnit: price, total: qty * price,
      baseUnitsPerStock: selectedDrug.baseUnitsPerStock, basePerIntermediate: selectedDrug.basePerIntermediate,
      stockUnit: selectedDrug.stockUnit, intermediateUnit: selectedDrug.intermediateUnit, baseUnit: selectedDrug.baseUnit,
      hasIntermediate: selectedDrug.hasIntermediate
    };
    if (editingCartIndex !== null) {
      cart[editingCartIndex] = line;
    } else {
      cart.push(line);
    }
    closeConfigure();
    renderCart();
  };

  window.editCartItem = function (idx) {
    selectDrug(cart[idx].drugId, idx);
  };

  window.removeCartItem = function (idx) {
    cart.splice(idx, 1);
    renderCart();
  };

  window.clearCart = function () {
    if (cart.length === 0) return;
    if (!confirm("Clear the whole cart?")) return;
    cart = [];
    document.getElementById("onCredit").checked = false;
    document.getElementById("creditFields").classList.add("hidden");
    renderCart();
  };

  function renderCart() {
    const card = document.getElementById("cartCard");
    const list = document.getElementById("cartList");
    if (cart.length === 0) {
      card.classList.add("hidden");
      return;
    }
    card.classList.remove("hidden");
    list.innerHTML = cart.map((c, idx) => {
      const disp = cartLineDisplay(c);
      return `
      <div class="cart-item">
        <div>
          <div class="cart-item-name">${c.drugName}</div>
          <div class="cart-item-meta">${disp.topLine}</div>
          ${disp.subLine ? `<div class="cart-item-meta">${disp.subLine}</div>` : ""}
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <button class="btn-small btn-secondary" style="margin:0;" onclick="editCartItem(${idx})">Edit</button>
          <button class="btn-small btn-danger-outline" onclick="removeCartItem(${idx})">Remove</button>
        </div>
      </div>`;
    }).join("");
    const total = cart.reduce((sum, c) => sum + c.total, 0);
    document.getElementById("cartTotal").textContent = "Total: " + total.toLocaleString();
  }

  document.getElementById("onCredit").addEventListener("change", (e) => {
    document.getElementById("creditFields").classList.toggle("hidden", !e.target.checked);
  });
  document.getElementById("customerName").addEventListener("input", updateCreditLimitHint);

  async function customerBalance(customerId) {
    const snap = await getDocs(query(
      collection(db, "credit_transactions"),
      where("businessId", "==", currentBusinessId),
      where("shopId", "==", currentShopId),
      where("customerId", "==", customerId)
    ));
    return snap.docs.reduce((sum, d) => sum + (d.data().balanceChange || 0), 0);
  }

  async function updateCreditLimitHint() {
    const name = document.getElementById("customerName").value.trim();
    const hint = document.getElementById("creditLimitHint");
    const match = creditAccounts.find(c => c.name.toLowerCase() === name.toLowerCase());
    if (!match) { hint.textContent = name ? "New customer — will be added to Credit / Loans." : ""; return; }
    if (!match.creditLimit) { hint.textContent = "Existing customer, no credit limit set."; return; }
    const balance = await customerBalance(match.id);
    hint.textContent = `Existing customer — currently owes ${Math.max(0, balance).toLocaleString()}, limit ${match.creditLimit.toLocaleString()}.`;
  }

  async function getNextReceiptNumber() {
    const counterId = `${currentShopId}_sales`;
    const counterRef = doc(db, "counters", counterId);
    return await runTransaction(db, async (tx) => {
      const snap = await tx.get(counterRef);
      const next = snap.exists() ? (snap.data().next || 1) : 1;
      tx.set(counterRef, { businessId: currentBusinessId, shopId: currentShopId, next: next + 1 }, { merge: true });
      return next;
    });
  }

  function buildReceiptText(receiptNo, items, total, paymentStatus, customerName) {
    const lines = [];
    lines.push(businessName || "MediStock Cloud");
    if (currentShopName) lines.push(currentShopName);
    if (businessPhone) lines.push(businessPhone);
    lines.push("");
    lines.push(`Receipt: S-${receiptNo}`);
    lines.push(`Date: ${new Date().toLocaleString()}`);
    lines.push(`Cashier: ${cashierName}`);
    lines.push("---------------------------");
    items.forEach(i => {
      const disp = cartLineDisplay(i);
      lines.push(`${i.drugName}`);
      lines.push(`  ${disp.topLine}`);
      if (disp.subLine) lines.push(`  ${disp.subLine}`);
    });
    lines.push("---------------------------");
    lines.push(`TOTAL: ${total.toLocaleString()}`);
    lines.push(`Payment: ${paymentStatus === "CREDIT" ? "ON CREDIT" + (customerName ? " - " + customerName : "") : "PAID (CASH)"}`);
    return lines.join("\n");
  }

  let isSubmitting = false;

  window.completeSale = async function () {
    const statusEl = document.getElementById("saleStatus");
    if (cart.length === 0 || isSubmitting) return;
    const onCredit = document.getElementById("onCredit").checked;
    const customerNameInput = document.getElementById("customerName").value.trim();
    const customerPhoneInput = document.getElementById("customerPhone").value.trim();
    const expectedPaymentDateInput = document.getElementById("expectedPaymentDate").value;
    if (onCredit && !customerNameInput) {
      statusEl.textContent = "Enter the credit customer's name.";
      statusEl.style.color = "var(--danger)";
      return;
    }
    // Snapshot the cart right now — the rest of this function has several
    // awaits (network round-trips), during which the person could still tap
    // Edit/Remove/Clear Cart. Using this frozen copy for everything below
    // means a mid-flight cart change can never corrupt the sale being submitted.
    const saleItems = cart.slice();
    const grandTotal = saleItems.reduce((sum, c) => sum + c.total, 0);

    let matchedCustomer = onCredit ? creditAccounts.find(c => c.name.toLowerCase() === customerNameInput.toLowerCase()) : null;
    if (onCredit && matchedCustomer && matchedCustomer.creditLimit > 0) {
      const currentBal = await customerBalance(matchedCustomer.id);
      if (currentBal + grandTotal > matchedCustomer.creditLimit) {
        const over = Math.round(currentBal + grandTotal - matchedCustomer.creditLimit).toLocaleString();
        if (!confirm(`${customerNameInput} would exceed their credit limit by ${over}. Continue anyway?`)) return;
      }
    }

    const itemsList = saleItems.map(c => `${c.drugName} — ${cartLineDisplay(c).topLine}`).join("\n");
    if (!confirm(`Complete this ${onCredit ? "CREDIT " : ""}sale?\n\n${itemsList}\n\nGrand total: ${grandTotal.toLocaleString()}${onCredit ? `\nCustomer: ${customerNameInput}` : ""}`)) return;

    isSubmitting = true;
    document.getElementById("completeSaleBtn").disabled = true;
    document.getElementById("clearCartBtn").disabled = true;
    try {
      statusEl.textContent = "Checking current stock…"; statusEl.style.color = "var(--muted)";

      // Re-fetch live batches for every cart drug right before committing —
      // stock may have moved since items were added to the cart.
      const liveBatchesByDrug = {};
      for (const item of saleItems) {
        if (!liveBatchesByDrug[item.drugId]) {
          const snap = await getDocs(query(
            collection(db, "batches"),
            where("businessId", "==", currentBusinessId),
            where("shopId", "==", currentShopId),
            where("drugId", "==", item.drugId)
          ));
          liveBatchesByDrug[item.drugId] = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .filter(b => daysUntil(b.expiryDate) >= 0 && b.quantity > 0)
            .sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate));
        }
      }
      const liveDrugSnaps = {};
      for (const item of saleItems) {
        if (!liveDrugSnaps[item.drugId]) liveDrugSnaps[item.drugId] = await getDoc(doc(db, "drugs", item.drugId));
      }

      statusEl.textContent = "Reserving receipt number…";
      const receiptNo = await getNextReceiptNumber();

      statusEl.textContent = "Saving…";
      const batch = writeBatch(db);
      const drugDeductions = {}; // drugId -> remaining base to deduct, consumed across possibly-repeated cart lines
      saleItems.forEach(c => { drugDeductions[c.drugId] = (drugDeductions[c.drugId] || 0) + c.baseQtyNeeded; });

      const batchesUsedByDrug = {};
      for (const drugId of Object.keys(drugDeductions)) {
        let remaining = drugDeductions[drugId];
        const liveBatches = liveBatchesByDrug[drugId] || [];
        const used = [];
        if (liveBatches.length > 0) {
          for (const b of liveBatches) {
            if (remaining <= 0) break;
            const take = Math.min(remaining, b.quantity);
            if (take <= 0) continue;
            batch.update(doc(db, "batches", b.id), { quantity: b.quantity - take });
            used.push({ batchId: b.id, batchNumber: b.batchNumber || "", qty: take, costPerStockUnit: b.purchasePricePerStockUnit || b.costPerStockUnit || 0 });
            remaining -= take;
          }
        }
        if (remaining > 0) {
          // No batch coverage for the remainder (e.g. no batches recorded at all for this drug) —
          // fall back to simple deduction, same as the drug's own running total.
        }
        batchesUsedByDrug[drugId] = used;
        const drugSnap = liveDrugSnaps[drugId];
        const currentBase = drugSnap.exists() ? (drugSnap.data().currentStockBase || 0) : 0;
        batch.update(doc(db, "drugs", drugId), { currentStockBase: currentBase - drugDeductions[drugId] });
      }

      const receiptRef = doc(collection(db, "receipts"));
      const paymentStatus = onCredit ? "CREDIT" : "PAID";
      batch.set(receiptRef, {
        businessId: currentBusinessId, shopId: currentShopId,
        type: "SALE", displayNumber: `S-${receiptNo}`,
        createdAt: serverTimestamp(), cashier: cashierName,
        itemCount: saleItems.length, totalAmount: grandTotal, paymentStatus,
        customerId: matchedCustomer ? matchedCustomer.id : null,
        customerName: onCredit ? customerNameInput : "",
        items: saleItems.map(c => ({
          drugId: c.drugId, drugName: c.drugName, qty: c.qty, unitLabel: c.unitLabel,
          unitLevel: c.unitLevel, pricePerUnit: c.pricePerUnit, total: c.total,
          baseQtyNeeded: c.baseQtyNeeded, stockUnit: c.stockUnit, intermediateUnit: c.intermediateUnit,
          baseUnit: c.baseUnit, baseUnitsPerStock: c.baseUnitsPerStock, basePerIntermediate: c.basePerIntermediate
        }))
      });

      let customerId = matchedCustomer ? matchedCustomer.id : null;
      if (onCredit && !matchedCustomer) {
        const newCustomerRef = doc(collection(db, "credit_accounts"));
        batch.set(newCustomerRef, {
          businessId: currentBusinessId, shopId: currentShopId,
          name: customerNameInput, phone: customerPhoneInput || null, creditLimit: 0, createdAt: serverTimestamp()
        });
        customerId = newCustomerRef.id;
      } else if (onCredit && matchedCustomer && customerPhoneInput && customerPhoneInput !== matchedCustomer.phone) {
        batch.update(doc(db, "credit_accounts", matchedCustomer.id), { phone: customerPhoneInput });
      }

      saleItems.forEach(c => {
        const used = batchesUsedByDrug[c.drugId] || [];
        const costOfGoods = used.length
          ? used.reduce((s, u) => s + (u.qty / (c.baseUnitsPerStock || 1)) * (u.costPerStockUnit || 0), 0)
          : 0;
        const saleRef = doc(collection(db, "sales"));
        batch.set(saleRef, {
          businessId: currentBusinessId, shopId: currentShopId, ownerUid: currentUser.uid,
          drugId: c.drugId, drugName: c.drugName, drugClass: c.drugClass,
          unitLevel: c.unitLevel, qty: c.qty, baseQtyDeducted: c.baseQtyNeeded,
          pricePerUnit: c.pricePerUnit, total: c.total, costOfGoods,
          receiptId: receiptRef.id, cashier: cashierName, paymentStatus,
          customerId, createdAt: serverTimestamp()
        });
      });

      if (onCredit) {
        const creditTxnRef = doc(collection(db, "credit_transactions"));
        batch.set(creditTxnRef, {
          businessId: currentBusinessId, shopId: currentShopId,
          customerId, customerName: customerNameInput, type: "CREDIT_SALE",
          amount: grandTotal, paidAmount: 0, balanceChange: grandTotal,
          dueDate: expectedPaymentDateInput || null,
          receiptId: receiptRef.id, description: `Credit sale receipt S-${receiptNo}`,
          createdAt: serverTimestamp()
        });
      }

      await batch.commit();

      lastReceiptData = { receiptNo, items: saleItems, total: grandTotal, paymentStatus, customerName: customerNameInput };
      document.getElementById("receiptNumber").textContent = `S-${receiptNo}`;
      document.getElementById("receiptText").textContent = buildReceiptText(receiptNo, saleItems, grandTotal, paymentStatus, customerNameInput);
      document.getElementById("receiptCard").classList.remove("hidden");
      document.getElementById("cartCard").classList.add("hidden");
      window.scrollTo({ top: document.getElementById("receiptCard").offsetTop - 10, behavior: "smooth" });

      cart = [];
      document.getElementById("onCredit").checked = false;
      document.getElementById("creditFields").classList.add("hidden");
      document.getElementById("customerName").value = "";
      document.getElementById("customerPhone").value = "";
      document.getElementById("expectedPaymentDate").value = "";
      statusEl.textContent = "";
      loadFrequentlySold();
      loadCreditAccounts();
      loadRecentReceipts();
    } catch (err) {
      statusEl.textContent = "Failed: " + err.message;
      statusEl.style.color = "var(--danger)";
    } finally {
      isSubmitting = false;
      document.getElementById("completeSaleBtn").disabled = false;
      document.getElementById("clearCartBtn").disabled = false;
    }
  };

  window.startNewSale = function () {
    document.getElementById("receiptCard").classList.add("hidden");
    document.getElementById("searchBox").focus();
  };

  window.shareReceipt = async function () {
    if (!lastReceiptData) return;
    const text = document.getElementById("receiptText").textContent;
    if (navigator.share) {
      try { await navigator.share({ title: `Receipt S-${lastReceiptData.receiptNo}`, text }); }
      catch (e) { /* user cancelled share sheet — not an error */ }
    } else {
      try {
        await navigator.clipboard.writeText(text);
        alert("Sharing isn't available on this browser — the receipt text was copied instead, so you can paste it into WhatsApp or any app.");
      } catch (e) {
        alert("Sharing isn't available on this browser.");
      }
    }
  };

  window.saveReceiptToPhone = function () {
    if (!lastReceiptData) return;
    const text = document.getElementById("receiptText").textContent;
    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Receipt-S-${lastReceiptData.receiptNo}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  };

  async function loadFrequentlySold() {
    const snap = await getDocs(query(
      collection(db, "sales"),
      where("businessId", "==", currentBusinessId),
      where("shopId", "==", currentShopId)
    ));
    const cutoff = Date.now() - 30 * 86400000;
    const counts = {};
    snap.docs.forEach(d => {
      const s = d.data();
      const ts = s.createdAt?.toMillis ? s.createdAt.toMillis() : 0;
      if (ts < cutoff) return;
      counts[s.drugId] = (counts[s.drugId] || 0) + 1;
    });
    const topIds = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 6);
    const card = document.getElementById("frequentCard");
    const chips = document.getElementById("frequentChips");
    if (topIds.length === 0) { card.classList.add("hidden"); return; }
    const named = topIds.map(id => allDrugs.find(d => d.id === id)).filter(d => d && d.active !== false);
    if (named.length === 0) { card.classList.add("hidden"); return; }
    card.classList.remove("hidden");
    chips.innerHTML = named.map(d => `<div class="chip" onclick="selectDrug('${d.id}')">${d.name}</div>`).join("");
  }

  async function loadCreditAccounts() {
    const snap = await getDocs(query(
      collection(db, "credit_accounts"),
      where("businessId", "==", currentBusinessId),
      where("shopId", "==", currentShopId)
    ));
    creditAccounts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById("customerSuggestions").innerHTML =
      creditAccounts.map(c => `<option value="${c.name}"></option>`).join("");
  }

  async function loadRecentReceipts() {
    const container = document.getElementById("recentReceiptsList");
    try {
      const snap = await getDocs(query(
        collection(db, "receipts"),
        where("businessId", "==", currentBusinessId),
        where("shopId", "==", currentShopId),
        where("type", "==", "SALE")
      ));
      const receipts = snap.docs.map(d => d.data())
        .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0))
        .slice(0, 10);
      if (receipts.length === 0) {
        container.innerHTML = '<div class="empty">No sales yet.</div>';
        return;
      }
      container.innerHTML = receipts.map(r => {
        const date = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleString() : "";
        const paymentTag = r.paymentStatus === "CREDIT" ? ` · CREDIT${r.customerName ? " - " + r.customerName : ""}` : "";
        const itemLines = (r.items || []).map(i => {
          // hasIntermediate wasn't stored on older receipts — derive it from
          // whether an intermediate unit name exists at all.
          const disp = cartLineDisplay({ ...i, hasIntermediate: i.hasIntermediate ?? !!i.intermediateUnit });
          return `
            <div class="cart-item">
              <div>
                <div class="cart-item-name">${i.drugName}</div>
                <div class="cart-item-meta">${disp.topLine}</div>
                ${disp.subLine ? `<div class="cart-item-meta">${disp.subLine}</div>` : ""}
              </div>
            </div>`;
        }).join("");
        return `
          <div style="margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border);">
            <div class="cart-item-name">Receipt #${r.displayNumber} · ${date}</div>
            <div class="cart-item-meta" style="margin-bottom:6px;">${r.cashier || ""}${paymentTag}</div>
            ${itemLines || '<div class="empty">No item detail saved for this receipt.</div>'}
            <div class="total-line" style="font-size:15px; margin-top:6px;">Total: ${Number(r.totalAmount || 0).toLocaleString()}</div>
          </div>`;
      }).join("");
    } catch (err) {
      container.innerHTML = `<div class="empty" style="color:var(--danger);">Couldn't load receipts: ${err.message}</div>`;
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    currentUser = user;
    const userSnap = await getDoc(doc(db, "users", user.uid));
    if (!userSnap.exists()) { window.location.href = "login.html"; return; }
    const profile = userSnap.data();
    currentRole = profile.role;
    currentBusinessId = profile.businessId;
    cashierName = profile.role === "owner" ? user.email : profile.name;

    const bizSnap = await getDoc(doc(db, "businesses", currentBusinessId));
    if (bizSnap.exists()) { businessName = bizSnap.data().name || ""; businessPhone = bizSnap.data().phone || ""; }

    if (currentRole === "owner") {
      const shopsSnap = await getDocs(query(collection(db, "shops"), where("businessId", "==", currentBusinessId)));
      const activeId = localStorage.getItem("mc_activeShopId");
      const foundShop = shopsSnap.docs.find(d => d.id === activeId);
      const resolvedShopDoc = foundShop || (shopsSnap.empty ? null : shopsSnap.docs[0]);
      currentShopId = resolvedShopDoc ? resolvedShopDoc.id : null;
      currentShopName = resolvedShopDoc ? resolvedShopDoc.data().name : "";
      document.getElementById("shopIndicator").textContent = resolvedShopDoc
        ? `Working in: ${currentShopName}`
        : "No shop set up yet — go to Shops to add one.";
    } else {
      currentShopId = profile.shopId;
      const shopSnap = await getDoc(doc(db, "shops", currentShopId));
      currentShopName = shopSnap.exists() ? shopSnap.data().name : "";
      document.getElementById("shopIndicator").textContent = shopSnap.exists()
        ? `Shop: ${currentShopName}` : "(unknown shop)";
    }

    if (!currentShopId) return;

    const drugsQ = query(
      collection(db, "drugs"),
      where("businessId", "==", currentBusinessId),
      where("shopId", "==", currentShopId)
    );
    onSnapshot(drugsQ, { includeMetadataChanges: true }, (snap) => {
      const badge = document.getElementById("netBadge");
      const fromCache = snap.metadata.fromCache;
      badge.textContent = fromCache ? "offline (cached)" : "online (synced)";
      badge.className = "badge " + (fromCache ? "offline" : "online");
      allDrugs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
      if (document.getElementById("searchBox").value) renderResults(document.getElementById("searchBox").value);
    });

    loadFrequentlySold();
    loadCreditAccounts();
    loadRecentReceipts();
  });
</script>
</body>
</html>
