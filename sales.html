<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediStock Cloud — Sell</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --text:#e8e8ea; --muted:#9aa0aa;
    --accent:#3b82f6; --accent2:#22c55e; --danger:#ef4444; --border:#2a2e38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px; padding-bottom:40px;
  }
  h1{font-size:19px; margin:0;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; background:#1d2230; color:var(--muted);}
  .badge.online{color:var(--accent2);} .badge.offline{color:var(--danger);}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:14px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px;}
  input, select{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);
    background:#0d0f14; color:var(--text); font-size:14px;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  .row{display:flex; gap:8px;} .row > *{flex:1;}
  button{border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff; width:100%; padding:12px;}
  .result-item{
    padding:10px; border-bottom:1px solid var(--border); cursor:pointer;
  }
  .result-item:last-child{border-bottom:none;}
  .result-item:active{background:#1d2230;}
  .result-name{font-weight:600; font-size:14px;}
  .result-stock{font-size:12px; color:var(--muted);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px 0;}
  .selected-card{border:1px solid var(--accent);}
  .total-line{font-size:20px; font-weight:700; text-align:right; margin-top:12px;}
  .hint{font-size:11px; color:var(--muted); margin-top:6px;}
  .hidden{display:none !important;}
  .link{color:var(--accent); font-size:13px; text-decoration:none;}
</style>
</head>
<body>

<div class="topbar">
  <h1>Sell</h1>
  <span class="badge" id="netBadge">checking…</span>
</div>

<div style="margin-bottom:12px;"><a class="link" href="inventory.html">← Back to Inventory</a></div>

<div class="card" id="searchCard">
  <input type="text" id="searchBox" placeholder="Search drug to sell…" autocomplete="off">
  <div id="results" style="margin-top:8px;"></div>
</div>

<div class="card hidden selected-card" id="sellCard">
  <h2 id="sellDrugName">—</h2>
  <div class="hint" id="sellDrugStock"></div>

  <label>Sell by</label>
  <select id="unitLevel"></select>

  <label>Quantity</label>
  <input type="number" id="qty" min="1" value="1">

  <div class="hint" id="stockCheckMsg"></div>
  <div class="total-line" id="totalLine">Total: 0</div>

  <button class="btn-primary" onclick="completeSale()">Record Sale</button>
  <div id="saleStatus" style="font-size:13px; margin-top:8px;"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, updateDoc, collection, addDoc, onSnapshot,
    enableIndexedDbPersistence, serverTimestamp, query, where
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXwKfb9yg3HAQFIPG6q3SYHU9C7FQvkNY",
    authDomain: "medistock-cloud-93b83.firebaseapp.com",
    projectId: "medistock-cloud-93b83",
    storageBucket: "medistock-cloud-93b83.firebasestorage.app",
    messagingSenderId: "615610747921",
    appId: "1:615610747921:web:94b6627b64a250362335b0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  let currentUser = null;
  let currentBusinessId = null;
  let currentShopId = null;
  let allDrugs = [];
  let selectedDrug = null;

  const PackagingEngine = {
    baseToBreakdown(baseQty, baseUnitsPerStock, basePerIntermediate) {
      baseUnitsPerStock = Number(baseUnitsPerStock) || 0;
      basePerIntermediate = Number(basePerIntermediate) || 0;
      let stockUnits = 0, remainder = baseQty;
      if (baseUnitsPerStock > 0) {
        stockUnits = Math.floor(baseQty / baseUnitsPerStock);
        remainder = baseQty - stockUnits * baseUnitsPerStock;
      }
      let intermediateUnits = 0, looseBase = remainder;
      if (basePerIntermediate > 0) {
        intermediateUnits = Math.floor(remainder / basePerIntermediate);
        looseBase = remainder - intermediateUnits * basePerIntermediate;
      }
      return { stockUnits, intermediateUnits, looseBase };
    },
    unitQuantityToBase(qty, unitLevel, baseUnitsPerStock, basePerIntermediate) {
      if (unitLevel === "stock") return qty * (Number(baseUnitsPerStock) || 0);
      if (unitLevel === "intermediate") return qty * (Number(basePerIntermediate) || 0);
      return qty; // base
    }
  };

  function stockSummary(d) {
    const b = PackagingEngine.baseToBreakdown(d.currentStockBase, d.baseUnitsPerStock, d.basePerIntermediate);
    const parts = [];
    if (b.stockUnits) parts.push(`${b.stockUnits} ${d.stockUnit}(s)`);
    if (d.hasIntermediate && b.intermediateUnits) parts.push(`${b.intermediateUnits} ${d.intermediateUnit}(s)`);
    if (b.looseBase) parts.push(`${b.looseBase} ${d.baseUnit}(s)`);
    return parts.length ? parts.join(", ") : `0 ${d.baseUnit}(s)`;
  }

  function renderResults(filterText) {
    const box = document.getElementById("results");
    if (!filterText) { box.innerHTML = ""; return; }
    const matches = allDrugs.filter(d => d.name.toLowerCase().includes(filterText.toLowerCase()));
    if (matches.length === 0) {
      box.innerHTML = '<div class="empty">No matching drug in stock.</div>';
      return;
    }
    box.innerHTML = matches.map(d => `
      <div class="result-item" onclick="selectDrug('${d.id}')">
        <div class="result-name">${d.name}</div>
        <div class="result-stock">${stockSummary(d)}</div>
      </div>`).join("");
  }
  document.getElementById("searchBox").addEventListener("input", (e) => renderResults(e.target.value));

  window.selectDrug = function (id) {
    selectedDrug = allDrugs.find(d => d.id === id);
    if (!selectedDrug) return;
    document.getElementById("searchBox").value = selectedDrug.name;
    document.getElementById("results").innerHTML = "";
    document.getElementById("sellCard").classList.remove("hidden");
    document.getElementById("sellDrugName").textContent = selectedDrug.name;
    document.getElementById("sellDrugStock").textContent = "In stock: " + stockSummary(selectedDrug);

    const unitSel = document.getElementById("unitLevel");
    const options = [];
    options.push(`<option value="base">${selectedDrug.baseUnit} (base unit) — ${selectedDrug.retailBase || 0} each</option>`);
    if (selectedDrug.hasIntermediate) {
      options.push(`<option value="intermediate">${selectedDrug.intermediateUnit} — ${selectedDrug.retailIntermediate || 0} each</option>`);
    }
    options.push(`<option value="stock">${selectedDrug.stockUnit} — ${selectedDrug.retailStock || 0} each</option>`);
    unitSel.innerHTML = options.join("");
    document.getElementById("qty").value = 1;
    document.getElementById("saleStatus").textContent = "";
    updateTotal();
  };

  function priceFor(unitLevel) {
    if (unitLevel === "stock") return Number(selectedDrug.retailStock) || 0;
    if (unitLevel === "intermediate") return Number(selectedDrug.retailIntermediate) || 0;
    return Number(selectedDrug.retailBase) || 0;
  }

  function updateTotal() {
    if (!selectedDrug) return;
    const unitLevel = document.getElementById("unitLevel").value;
    const qty = Number(document.getElementById("qty").value) || 0;
    const baseQtyNeeded = PackagingEngine.unitQuantityToBase(qty, unitLevel, selectedDrug.baseUnitsPerStock, selectedDrug.basePerIntermediate);
    const total = qty * priceFor(unitLevel);
    document.getElementById("totalLine").textContent = "Total: " + total.toLocaleString();

    const msgEl = document.getElementById("stockCheckMsg");
    if (baseQtyNeeded > selectedDrug.currentStockBase) {
      msgEl.textContent = `Not enough stock — only ${stockSummary(selectedDrug)} available.`;
      msgEl.style.color = "var(--danger)";
    } else {
      msgEl.textContent = "";
    }
  }
  document.getElementById("unitLevel").addEventListener("change", updateTotal);
  document.getElementById("qty").addEventListener("input", updateTotal);

  window.completeSale = async function () {
    const statusEl = document.getElementById("saleStatus");
    if (!selectedDrug) return;
    const unitLevel = document.getElementById("unitLevel").value;
    const qty = Number(document.getElementById("qty").value) || 0;
    if (qty <= 0) { statusEl.textContent = "Enter a quantity."; statusEl.style.color = "var(--danger)"; return; }

    const baseQtyNeeded = PackagingEngine.unitQuantityToBase(qty, unitLevel, selectedDrug.baseUnitsPerStock, selectedDrug.basePerIntermediate);
    if (baseQtyNeeded > selectedDrug.currentStockBase) {
      statusEl.textContent = "Not enough stock for this sale.";
      statusEl.style.color = "var(--danger)";
      return;
    }
    const total = qty * priceFor(unitLevel);

    try {
      statusEl.textContent = "Saving…"; statusEl.style.color = "var(--muted)";
      const newStockBase = selectedDrug.currentStockBase - baseQtyNeeded;

      await updateDoc(doc(db, "drugs", selectedDrug.id), { currentStockBase: newStockBase });

      await addDoc(collection(db, "sales"), {
        businessId: currentBusinessId,
        shopId: currentShopId,
        ownerUid: currentUser.uid,
        drugId: selectedDrug.id,
        drugName: selectedDrug.name,
        unitLevel,
        qty,
        baseQtyDeducted: baseQtyNeeded,
        pricePerUnit: priceFor(unitLevel),
        total,
        createdAt: serverTimestamp()
      });

      statusEl.textContent = `Sale recorded — Total ${total.toLocaleString()}`;
      statusEl.style.color = "var(--accent2)";
      selectedDrug.currentStockBase = newStockBase; // reflect locally until snapshot updates
      document.getElementById("sellDrugStock").textContent = "In stock: " + stockSummary(selectedDrug);
      document.getElementById("qty").value = 1;
      updateTotal();
    } catch (err) {
      statusEl.textContent = "Failed: " + err.message;
      statusEl.style.color = "var(--danger)";
    }
  };

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    currentUser = user;
    const userSnap = await getDoc(doc(db, "users", user.uid));
    if (!userSnap.exists()) { window.location.href = "login.html"; return; }
    currentBusinessId = userSnap.data().businessId;

    const shopsQ = query(collection(db, "shops"), where("ownerUid", "==", user.uid));
    onSnapshot(shopsQ, (snap) => { if (!snap.empty) currentShopId = snap.docs[0].id; });

    const drugsQ = query(collection(db, "drugs"), where("ownerUid", "==", user.uid));
    onSnapshot(drugsQ, { includeMetadataChanges: true }, (snap) => {
      const badge = document.getElementById("netBadge");
      const fromCache = snap.metadata.fromCache;
      badge.textContent = fromCache ? "offline (cached)" : "online (synced)";
      badge.className = "badge " + (fromCache ? "offline" : "online");
      allDrugs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
      if (document.getElementById("searchBox").value) renderResults(document.getElementById("searchBox").value);
    });
  });
</script>
</body>
</html>
