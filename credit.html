<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediStock Cloud — Credit / Loans</title>
<style>
  :root{
    --bg:#f4f7f5; --card:#ffffff; --text:#152420; --muted:#4b5f59;
    --accent:#0f6b5c; --accent2:#2e7d32; --warn:#c97a1f; --danger:#b23b3b; --border:#dbe4e0;
  }
  html[data-theme="dark"]{
    --bg:#0d1614; --card:#16211d; --text:#e7f2ee; --muted:#9fb6ae;
    --accent:#2bbfa0; --accent2:#4fd07a; --warn:#e2a53d; --danger:#e2685f; --border:#2a3934;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px; padding-bottom:40px;
  }
  h1{font-size:19px; margin:0;}
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; background:var(--border); color:var(--muted);}
  .badge.online{color:var(--accent2);} .badge.offline{color:var(--danger);}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:15px; margin:0 0 10px; color:var(--accent); font-weight:700;}
  label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px;}
  input, select{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:14px;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  .row{display:flex; gap:8px;} .row > *{flex:1;}
  button{border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff; width:100%; padding:12px; margin-top:10px;}
  .btn-secondary{background:transparent; color:var(--accent); border:1px solid var(--accent); width:100%; padding:10px; margin-top:8px;}
  .btn-danger-outline{background:transparent; border:1px solid var(--danger); color:var(--danger); width:100%; padding:10px; margin-top:8px;}
  .btn-small{width:auto; padding:7px 12px; font-size:12.5px; margin-top:0;}
  .filter-row{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .filter-btn{background:transparent; color:var(--muted); border:1px solid var(--border); padding:7px 12px; font-size:12.5px; width:auto;}
  .filter-btn.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .cust-row{padding:12px 0; border-bottom:1px solid var(--border); cursor:pointer;}
  .cust-row:last-child{border-bottom:none;}
  .cust-row:active{background:var(--bg);}
  .cust-name{font-weight:600; font-size:15px;}
  .cust-meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .pill{font-size:10px; padding:2px 8px; border-radius:999px; margin-left:6px;}
  .pill.ok{background:rgba(46,125,50,.12); color:var(--accent2);}
  .pill.danger{background:rgba(178,59,59,.15); color:var(--danger);}
  .pill.neutral{background:var(--border); color:var(--muted);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px 0;}
  .hidden{display:none !important;}
  .tx-row{padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .tx-row:last-child{border-bottom:none;}

  /* ===== Shared MediStock Cloud navigation ===== */
  .app-header{
    position:sticky; top:0; z-index:20;
    background:var(--accent); color:#fff;
    margin:-16px -16px 14px; padding:16px 18px 14px;
  }
  .app-header h1{margin:0; font-size:19px; letter-spacing:.2px; font-weight:700; color:#fff;}
  .app-header p{margin:2px 0 0; font-size:12.5px; color:rgba(255,255,255,.75);}
  .nav-bar{
    position:sticky; top:0; z-index:25;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--accent); color:#fff;
    margin:-14px -16px 14px; padding:8px 6px; border-top:1px solid rgba(255,255,255,.15);
  }
  .hamburger-btn{
    background:none; border:none; color:#fff; font-size:22px; line-height:1;
    padding:8px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .nav-bar-brand{
    font-size:14px; font-weight:600; color:#fff; cursor:pointer;
    padding:8px 10px; -webkit-tap-highlight-color:transparent;
  }
  .nav-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:29;}
  .nav-overlay.visible{display:block;}
  .nav-panel{
    position:fixed; top:0; bottom:0; right:0; z-index:30;
    width:78%; max-width:300px;
    background:var(--accent);
    display:flex; flex-direction:column; gap:4px;
    padding:16px 10px; overflow-y:auto;
    transform:translateX(105%);
    transition:transform .22s ease;
    box-shadow:0 0 20px rgba(0,0,0,.3);
  }
  .nav-panel.open{transform:translateX(0);}
  .nav-panel-title{
    color:rgba(255,255,255,.75); font-size:12px; text-transform:uppercase; letter-spacing:.5px;
    margin:4px 6px 6px;
  }
  .nav-panel a{
    display:block; background:rgba(255,255,255,.1); color:#fff;
    border:1px solid rgba(255,255,255,.2); padding:12px 14px; margin-bottom:4px;
    border-radius:10px; font-size:14.5px; font-weight:600; text-align:left;
    text-decoration:none;
  }
  .nav-panel a.active{background:var(--card); color:var(--accent);}
  .nav-panel .theme-toggle{
    margin-top:10px; background:rgba(255,255,255,.1); color:#fff;
    border:1px solid rgba(255,255,255,.2); padding:10px 14px; border-radius:10px;
    font-size:13px; font-weight:600; cursor:pointer; text-align:left; width:100%;
  }
</style>
<script>
(function(){
  try{
    var pref = localStorage.getItem('mcThemePreference') || 'auto';
    var isDark = pref==='dark' || (pref==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  }catch(e){}
})();
</script>
</head>
<body>

<header class="app-header">
  <h1>MediStock Cloud</h1>
  <p>Multi-Shop Edition · Credit / Loans</p>
</header>
<div class="nav-bar">
  <button class="hamburger-btn" id="navToggle" aria-label="Menu" type="button">&#9776;</button>
  <div class="nav-bar-brand" onclick="location.href='dashboard.html'">🏠 Home</div>
  <span class="badge" id="netBadge">checking…</span>
</div>
<div class="nav-overlay" id="navOverlay"></div>
<nav class="nav-panel" id="navPanel">
  <div class="nav-panel-title">Menu</div>
  <a href="dashboard.html">Dashboard</a>
  <a href="sales.html">Sell</a>
  <a href="inventory.html">Inventory</a>
  <a href="purchases.html">Purchases</a>
  <a href="batches.html">Batches</a>
  <a href="stocktake.html">Stock Taking</a>
  <a href="whattobuy.html">What to Buy</a>
  <a href="expenses.html">Expenses</a>
  <a href="credit.html" class="active">Credit / Loans</a>
  <a href="suppliers.html">Suppliers</a>
  <a href="shops.html">Shops</a>
  <a href="settings.html">Settings</a>
  <button type="button" class="theme-toggle" id="themeToggle">Theme</button>
</nav>
<div class="hint" id="shopIndicator" style="margin-bottom:8px; font-size:11px; color:var(--muted);"></div>

<div class="card">
  <input type="text" id="searchBox" placeholder="Search customer name or phone…" style="margin-bottom:10px;">
  <div class="filter-row">
    <select id="ratingFilter" style="width:auto; flex:1;">
      <option value="all">All ratings</option>
      <option value="OVERDUE">⚠ Overdue</option>
      <option value="GOOD">✓ Good standing</option>
      <option value="SETTLED">★ Settled</option>
    </select>
    <button class="filter-btn" id="showDeactivatedBtn">Show deactivated</button>
  </div>
  <div id="customersList"><div class="empty">Loading…</div></div>
</div>

<div class="card">
  <button class="btn-secondary" id="toggleAddFormBtn" style="margin-top:0;">+ Add Customer</button>
  <div id="addFormBlock" class="hidden" style="margin-top:12px;">
    <label>Name</label>
    <input type="text" id="newName">
    <label>Phone (optional)</label>
    <input type="text" id="newPhone">
    <label>Credit limit (optional — 0 means no limit)</label>
    <input type="number" id="newLimit" value="0" min="0">
    <label>Note (optional)</label>
    <input type="text" id="newNote">
    <button class="btn-primary" onclick="addCustomer()">Save Customer</button>
    <div id="addStatus" style="font-size:12.5px; margin-top:6px;"></div>
  </div>
</div>

<div class="card hidden" id="accountCard">
  <h2 id="accountTitle">—</h2>
  <div class="hint" id="accountSummary" style="font-size:13px; color:var(--text); margin-bottom:10px;"></div>

  <div class="filter-row">
    <button class="btn-small filter-btn" onclick="promptRecordPayment()">Record Payment</button>
    <button class="btn-small filter-btn" onclick="openEditBlock()">Edit Details</button>
    <button class="btn-small filter-btn" id="toggleActiveBtn" onclick="toggleCustomerActive()"></button>
  </div>

  <div id="editBlock" class="hidden" style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
    <label>Name</label>
    <input type="text" id="editName">
    <label>Phone</label>
    <input type="text" id="editPhone">
    <label>Credit limit</label>
    <input type="number" id="editLimit" min="0">
    <button class="btn-primary" onclick="saveCustomerEdit()">Save Changes</button>
    <button class="btn-secondary" onclick="document.getElementById('editBlock').classList.add('hidden')">Cancel</button>
    <div id="editStatus" style="font-size:12.5px; margin-top:6px;"></div>
  </div>

  <h2 style="margin-top:16px;">Transaction History</h2>
  <div id="accountTransactions"></div>
</div>

<script>
  (function(){
    var toggle = document.getElementById('navToggle');
    var panel = document.getElementById('navPanel');
    var overlay = document.getElementById('navOverlay');
    function closeNav(){ panel.classList.remove('open'); overlay.classList.remove('visible'); }
    function openNav(){ panel.classList.add('open'); overlay.classList.add('visible'); }
    toggle && toggle.addEventListener('click', function(){
      panel.classList.contains('open') ? closeNav() : openNav();
    });
    overlay && overlay.addEventListener('click', closeNav);

    var themeBtn = document.getElementById('themeToggle');
    var order = ['auto','light','dark'];
    var labels = {auto:'\ud83c\udf13 Theme: Auto', light:'\u2600\ufe0f Theme: Light', dark:'\ud83c\udf19 Theme: Dark'};
    function applyPref(pref){
      var isDark = pref==='dark' || (pref==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      if (themeBtn) themeBtn.textContent = labels[pref];
    }
    var current = localStorage.getItem('mcThemePreference') || 'auto';
    applyPref(current);
    themeBtn && themeBtn.addEventListener('click', function(){
      current = order[(order.indexOf(current)+1) % order.length];
      localStorage.setItem('mcThemePreference', current);
      applyPref(current);
    });

    var addBtn = document.getElementById('toggleAddFormBtn');
    addBtn.addEventListener('click', function(){
      var block = document.getElementById('addFormBlock');
      var isOpen = !block.classList.contains('hidden');
      block.classList.toggle('hidden', isOpen);
      addBtn.textContent = isOpen ? '+ Add Customer' : '– Close';
      if (!isOpen) document.getElementById('newName').focus();
    });
  })();
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, getDocs, updateDoc, collection, addDoc,
    onSnapshot, enableIndexedDbPersistence, serverTimestamp, query, where
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXwKfb9yg3HAQFIPG6q3SYHU9C7FQvkNY",
    authDomain: "medistock-cloud-93b83.firebaseapp.com",
    projectId: "medistock-cloud-93b83",
    storageBucket: "medistock-cloud-93b83.firebasestorage.app",
    messagingSenderId: "615610747921",
    appId: "1:615610747921:web:94b6627b64a250362335b0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  let currentBusinessId = null;
  let currentShopId = null;
  let allCustomers = [];
  let allTxns = [];
  let showDeactivated = false;
  let currentAccountId = null;

  function customerBalance(id) {
    return allTxns.filter(t => t.customerId === id).reduce((sum, t) => sum + (t.balanceChange || 0), 0);
  }

  function customerRating(id) {
    const bal = customerBalance(id);
    if (bal <= 0) return { code: "SETTLED", label: "★ Settled", cls: "neutral" };
    const today = new Date();
    const overdue = allTxns.some(t => t.customerId === id && t.type === "CREDIT_SALE" && t.dueDate && new Date(t.dueDate) < today);
    return overdue ? { code: "OVERDUE", label: "⚠ Overdue", cls: "danger" } : { code: "GOOD", label: "✓ Good standing", cls: "ok" };
  }

  function renderList() {
    const box = document.getElementById("customersList");
    const q = document.getElementById("searchBox").value.toLowerCase();
    const ratingFilter = document.getElementById("ratingFilter").value;
    let list = allCustomers.filter(c => showDeactivated ? c.active === false : c.active !== false);
    if (q) list = list.filter(c => c.name.toLowerCase().includes(q) || (c.phone || "").includes(q));
    const rows = list.map(c => ({ c, b: customerBalance(c.id), rating: customerRating(c.id) }))
      .filter(r => ratingFilter === "all" || r.rating.code === ratingFilter);
    const order = { OVERDUE: 0, GOOD: 1, SETTLED: 2 };
    rows.sort((a, b) => order[a.rating.code] - order[b.rating.code]);
    if (rows.length === 0) {
      box.innerHTML = '<div class="empty">No credit customers match this filter.</div>';
      return;
    }
    box.innerHTML = rows.map(({ c, b, rating }) => `
      <div class="cust-row" onclick="openAccount('${c.id}')">
        <div class="cust-name">${c.name}<span class="pill ${rating.cls}">${rating.label}</span>${c.active === false ? '<span class="pill neutral">Deactivated</span>' : ""}</div>
        <div class="cust-meta">${c.phone || "No phone"} · Outstanding: <b>${Math.round(b).toLocaleString()}</b></div>
      </div>`).join("");
  }

  document.getElementById("searchBox").addEventListener("input", renderList);
  document.getElementById("ratingFilter").addEventListener("change", renderList);
  document.getElementById("showDeactivatedBtn").addEventListener("click", (e) => {
    showDeactivated = !showDeactivated;
    e.target.classList.toggle("on", showDeactivated);
    renderList();
  });

  window.addCustomer = async function () {
    const statusEl = document.getElementById("addStatus");
    const name = document.getElementById("newName").value.trim();
    if (!name) { statusEl.textContent = "Enter a customer name."; statusEl.style.color = "var(--danger)"; return; }
    try {
      statusEl.textContent = "Saving…"; statusEl.style.color = "var(--muted)";
      await addDoc(collection(db, "credit_accounts"), {
        businessId: currentBusinessId, shopId: currentShopId,
        name, phone: document.getElementById("newPhone").value.trim(),
        creditLimit: Number(document.getElementById("newLimit").value) || 0,
        note: document.getElementById("newNote").value.trim(),
        active: true, createdAt: serverTimestamp()
      });
      document.getElementById("newName").value = "";
      document.getElementById("newPhone").value = "";
      document.getElementById("newLimit").value = "0";
      document.getElementById("newNote").value = "";
      document.getElementById("addFormBlock").classList.add("hidden");
      document.getElementById("toggleAddFormBtn").textContent = "+ Add Customer";
      statusEl.textContent = "";
    } catch (err) {
      statusEl.textContent = "Failed: " + err.message;
      statusEl.style.color = "var(--danger)";
    }
  };

  window.openAccount = function (id) {
    currentAccountId = id;
    const c = allCustomers.find(x => x.id === id);
    if (!c) return;
    const b = customerBalance(id);
    const rating = customerRating(id);
    document.getElementById("accountCard").classList.remove("hidden");
    document.getElementById("editBlock").classList.add("hidden");
    document.getElementById("accountTitle").textContent = c.name;
    document.getElementById("accountSummary").innerHTML =
      `Phone: ${c.phone || "—"}<br>Outstanding: <b>${Math.round(b).toLocaleString()}</b><br>` +
      `Credit limit: ${c.creditLimit ? Math.round(c.creditLimit).toLocaleString() : "Not set"}<br>` +
      `Rating: <span class="pill ${rating.cls}">${rating.label}</span>`;
    document.getElementById("toggleActiveBtn").textContent = c.active === false ? "Reactivate Customer" : "Deactivate Customer";

    const txs = allTxns.filter(t => t.customerId === id)
      .sort((a, b2) => (b2.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
    document.getElementById("accountTransactions").innerHTML = txs.length
      ? txs.map(t => `
          <div class="tx-row">
            <span class="pill neutral" style="margin-left:0;">${t.type}</span> ${Math.round(t.amount || Math.abs(t.balanceChange || 0)).toLocaleString()}<br>
            <span class="cust-meta">${t.createdAt?.toDate ? t.createdAt.toDate().toLocaleString() : ""} · ${t.description || ""}${t.dueDate ? " · due " + t.dueDate : ""}</span>
          </div>`).join("")
      : '<div class="empty">No transactions.</div>';
    document.getElementById("accountCard").scrollIntoView({ behavior: "smooth", block: "start" });
  };

  window.promptRecordPayment = async function () {
    const id = currentAccountId;
    const c = allCustomers.find(x => x.id === id);
    const bal = customerBalance(id);
    if (bal <= 0) { alert("This customer has no outstanding balance."); return; }
    const raw = prompt(`Enter payment amount for ${c.name}. Outstanding: ${Math.round(bal).toLocaleString()}`);
    if (raw === null) return;
    const amount = Number(raw);
    if (!Number.isFinite(amount) || amount <= 0) { alert("Enter a valid payment amount."); return; }
    if (amount > bal) {
      alert(`Payment cannot be greater than the outstanding balance.\n\nOutstanding: ${Math.round(bal).toLocaleString()}\nEntered: ${Math.round(amount).toLocaleString()}`);
      return;
    }
    try {
      await addDoc(collection(db, "credit_transactions"), {
        businessId: currentBusinessId, shopId: currentShopId,
        customerId: id, customerName: c.name, type: "PAYMENT",
        amount, paidAmount: amount, balanceChange: -amount,
        description: "Customer credit payment", createdAt: serverTimestamp()
      });
      openAccount(id);
    } catch (err) {
      alert("Failed: " + err.message);
    }
  };

  window.openEditBlock = function () {
    const c = allCustomers.find(x => x.id === currentAccountId);
    if (!c) return;
    document.getElementById("editName").value = c.name || "";
    document.getElementById("editPhone").value = c.phone || "";
    document.getElementById("editLimit").value = c.creditLimit || 0;
    document.getElementById("editBlock").classList.remove("hidden");
  };

  window.saveCustomerEdit = async function () {
    const statusEl = document.getElementById("editStatus");
    const newName = document.getElementById("editName").value.trim();
    if (!newName) { statusEl.textContent = "Name cannot be empty."; statusEl.style.color = "var(--danger)"; return; }
    try {
      statusEl.textContent = "Saving…"; statusEl.style.color = "var(--muted)";
      await updateDoc(doc(db, "credit_accounts", currentAccountId), {
        name: newName,
        phone: document.getElementById("editPhone").value.trim(),
        creditLimit: Number(document.getElementById("editLimit").value) || 0
      });
      document.getElementById("editBlock").classList.add("hidden");
    } catch (err) {
      statusEl.textContent = "Failed: " + err.message;
      statusEl.style.color = "var(--danger)";
    }
  };

  window.toggleCustomerActive = async function () {
    const c = allCustomers.find(x => x.id === currentAccountId);
    if (!c) return;
    if (c.active !== false && !confirm(`Deactivate ${c.name}? They'll be hidden from the active customer list but their history is kept.`)) return;
    try {
      await updateDoc(doc(db, "credit_accounts", c.id), { active: c.active === false ? true : false });
      document.getElementById("accountCard").classList.add("hidden");
    } catch (err) {
      alert("Failed: " + err.message);
    }
  };

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    const userSnap = await getDoc(doc(db, "users", user.uid));
    if (!userSnap.exists()) { window.location.href = "login.html"; return; }
    const profile = userSnap.data();
    currentBusinessId = profile.businessId;

    if (profile.role === "owner") {
      const shopsSnap = await getDocs(query(collection(db, "shops"), where("businessId", "==", currentBusinessId)));
      const activeId = localStorage.getItem("mc_activeShopId");
      const foundShop = shopsSnap.docs.find(d => d.id === activeId);
      const resolvedShopDoc = foundShop || (shopsSnap.empty ? null : shopsSnap.docs[0]);
      currentShopId = resolvedShopDoc ? resolvedShopDoc.id : null;
      document.getElementById("shopIndicator").textContent = resolvedShopDoc ? `Viewing: ${resolvedShopDoc.data().name}` : "No shop set up yet.";
    } else {
      currentShopId = profile.shopId;
      const shopSnap = await getDoc(doc(db, "shops", currentShopId));
      document.getElementById("shopIndicator").textContent = shopSnap.exists() ? `Shop: ${shopSnap.data().name}` : "";
    }
    if (!currentShopId) return;

    const custQ = query(collection(db, "credit_accounts"), where("businessId", "==", currentBusinessId), where("shopId", "==", currentShopId));
    onSnapshot(custQ, (snap) => {
      allCustomers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderList();
    });

    const txnQ = query(collection(db, "credit_transactions"), where("businessId", "==", currentBusinessId), where("shopId", "==", currentShopId));
    onSnapshot(txnQ, { includeMetadataChanges: true }, (snap) => {
      const badge = document.getElementById("netBadge");
      const fromCache = snap.metadata.fromCache;
      badge.textContent = fromCache ? "offline (cached)" : "online (synced)";
      badge.className = "badge " + (fromCache ? "offline" : "online");
      allTxns = snap.docs.map(d => d.data());
      renderList();
      if (currentAccountId) openAccount(currentAccountId);
    });
  });
</script>
</body>
</html>
