<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediStock Cloud — Credit</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --text:#e8e8ea; --muted:#9aa0aa;
    --accent:#3b82f6; --accent2:#22c55e; --warn:#eab308; --danger:#ef4444; --border:#2a2e38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px; padding-bottom:40px;
  }
  h1{font-size:19px; margin:0;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; background:#1d2230; color:var(--muted);}
  .badge.online{color:var(--accent2);} .badge.offline{color:var(--danger);}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:14px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px;}
  input, textarea{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);
    background:#0d0f14; color:var(--text); font-size:14px; font-family:inherit;
  }
  input:focus, textarea:focus{outline:none; border-color:var(--accent);}
  .row{display:flex; gap:8px;} .row > *{flex:1;}
  button{border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff; width:100%; padding:12px; margin-top:12px;}
  .btn-toggle{background:transparent; color:var(--accent); border:1px solid var(--accent); width:100%; padding:10px;}
  .btn-charge{background:var(--danger); color:#fff; flex:1; padding:10px;}
  .btn-pay{background:var(--accent2); color:#111; flex:1; padding:10px;}
  .cust-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer;
  }
  .cust-item:last-child{border-bottom:none;}
  .cust-name{font-size:14px; font-weight:600;}
  .cust-meta{font-size:12px; color:var(--muted);}
  .cust-bal{font-size:14px; font-weight:700;}
  .cust-bal.over{color:var(--danger);}
  .hidden{display:none !important;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px 0;}
  .link{color:var(--accent); font-size:13px; text-decoration:none;}
  .back-link{display:inline-block; margin-bottom:10px;}
  .txn-row{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--border);}
  .txn-row:last-child{border-bottom:none;}
  .txn-amt.charge{color:var(--danger);}
  .txn-amt.payment{color:var(--accent2);}
  .balance-big{font-size:26px; font-weight:800; text-align:center; margin:6px 0;}
  .limit-note{font-size:12px; color:var(--muted); text-align:center; margin-bottom:10px;}
</style>
</head>
<body>

<div class="topbar">
  <h1>Credit / Loans</h1>
  <span class="badge" id="netBadge">checking…</span>
</div>

<div style="margin-bottom:12px;">
  <a class="link" href="inventory.html">Inventory</a> &nbsp;·&nbsp;
  <a class="link" href="sales.html">Sell</a> &nbsp;·&nbsp;
  <a class="link" href="dashboard.html">Dashboard</a>
</div>

<!-- CUSTOMER LIST + ADD -->
<div id="listView">
  <div class="card">
    <input type="text" id="searchBox" placeholder="Search customer…">
  </div>

  <div class="card">
    <h2>Customers</h2>
    <div id="custList"><div class="empty">Loading…</div></div>
  </div>

  <div class="card">
    <h2>Add Customer</h2>
    <label>Name *</label>
    <input type="text" id="c_name" placeholder="e.g. John Doe">
    <div class="row">
      <div>
        <label>Phone</label>
        <input type="text" id="c_phone" placeholder="Optional">
      </div>
      <div>
        <label>Credit limit (0 = no limit)</label>
        <input type="number" id="c_limit" min="0" value="0">
      </div>
    </div>
    <label>Note</label>
    <input type="text" id="c_note" placeholder="Optional">
    <button class="btn-primary" onclick="addCustomer()">Add Customer</button>
    <div id="addStatus" style="font-size:13px; margin-top:8px;"></div>
  </div>
</div>

<!-- CUSTOMER DETAIL -->
<div id="detailView" class="hidden">
  <a class="link back-link" href="#" onclick="backToList(); return false;">← All customers</a>

  <div class="card">
    <h2 id="detailName">—</h2>
    <div class="balance-big" id="detailBalance">0</div>
    <div class="limit-note" id="detailLimitNote"></div>
    <div class="row">
      <button class="btn-charge" onclick="openTxnForm('charge')">+ Add Charge</button>
      <button class="btn-pay" onclick="openTxnForm('payment')">Record Payment</button>
    </div>
  </div>

  <div class="card hidden" id="txnFormCard">
    <h2 id="txnFormTitle">Add Charge</h2>
    <label>Amount</label>
    <input type="number" id="t_amount" min="0" placeholder="e.g. 20000">
    <label>Description</label>
    <input type="text" id="t_description" placeholder="e.g. Amoxicillin, 2 packets">
    <button class="btn-primary" onclick="saveTxn()">Save</button>
    <div id="txnStatus" style="font-size:13px; margin-top:8px;"></div>
  </div>

  <div class="card">
    <h2>History</h2>
    <div id="txnList"><div class="empty">Loading…</div></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, collection, addDoc, writeBatch, onSnapshot,
    enableIndexedDbPersistence, serverTimestamp, query, where
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXwKfb9yg3HAQFIPG6q3SYHU9C7FQvkNY",
    authDomain: "medistock-cloud-93b83.firebaseapp.com",
    projectId: "medistock-cloud-93b83",
    storageBucket: "medistock-cloud-93b83.firebasestorage.app",
    messagingSenderId: "615610747921",
    appId: "1:615610747921:web:94b6627b64a250362335b0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  let currentUser = null;
  let currentBusinessId = null;
  let currentShopId = null;
  let allCustomers = [];
  let selectedCustomer = null;
  let txnMode = "charge";
  let unsubTxns = null;

  window.addCustomer = async function () {
    const statusEl = document.getElementById("addStatus");
    const name = document.getElementById("c_name").value.trim();
    if (!name) { statusEl.textContent = "Enter a name."; statusEl.style.color = "var(--danger)"; return; }
    try {
      statusEl.textContent = "Saving…"; statusEl.style.color = "var(--muted)";
      await addDoc(collection(db, "credit_accounts"), {
        businessId: currentBusinessId, shopId: currentShopId, ownerUid: currentUser.uid,
        name,
        phone: document.getElementById("c_phone").value.trim(),
        creditLimit: Number(document.getElementById("c_limit").value) || 0,
        note: document.getElementById("c_note").value.trim(),
        balance: 0,
        createdAt: serverTimestamp()
      });
      statusEl.textContent = "Added.";
      ["c_name","c_phone","c_note"].forEach(id => document.getElementById(id).value = "");
      document.getElementById("c_limit").value = 0;
    } catch (err) {
      statusEl.textContent = "Failed: " + err.message;
      statusEl.style.color = "var(--danger)";
    }
  };

  function renderCustList(filterText) {
    const container = document.getElementById("custList");
    const list = filterText
      ? allCustomers.filter(c => c.name.toLowerCase().includes(filterText.toLowerCase()))
      : allCustomers;
    if (list.length === 0) {
      container.innerHTML = '<div class="empty">No customers yet.</div>';
      return;
    }
    container.innerHTML = list.map(c => {
      const over = c.creditLimit > 0 && c.balance > c.creditLimit;
      return `
        <div class="cust-item" onclick="openCustomer('${c.id}')">
          <div>
            <div class="cust-name">${c.name}</div>
            <div class="cust-meta">${c.phone || ""}</div>
          </div>
          <div class="cust-bal ${over ? "over" : ""}">${c.balance.toLocaleString()}</div>
        </div>`;
    }).join("");
  }
  document.getElementById("searchBox").addEventListener("input", (e) => renderCustList(e.target.value));

  window.openCustomer = function (id) {
    selectedCustomer = allCustomers.find(c => c.id === id);
    if (!selectedCustomer) return;
    document.getElementById("listView").classList.add("hidden");
    document.getElementById("detailView").classList.remove("hidden");
    document.getElementById("txnFormCard").classList.add("hidden");
    renderDetail();
    startTxnListener();
  };

  window.backToList = function () {
    if (unsubTxns) unsubTxns();
    document.getElementById("detailView").classList.add("hidden");
    document.getElementById("listView").classList.remove("hidden");
    selectedCustomer = null;
  };

  function renderDetail() {
    document.getElementById("detailName").textContent = selectedCustomer.name;
    const over = selectedCustomer.creditLimit > 0 && selectedCustomer.balance > selectedCustomer.creditLimit;
    const balEl = document.getElementById("detailBalance");
    balEl.textContent = selectedCustomer.balance.toLocaleString();
    balEl.style.color = over ? "var(--danger)" : "var(--text)";
    document.getElementById("detailLimitNote").textContent = selectedCustomer.creditLimit > 0
      ? `Limit: ${selectedCustomer.creditLimit.toLocaleString()}${over ? " — OVER LIMIT" : ""}`
      : "No credit limit set";
  }

  window.openTxnForm = function (mode) {
    txnMode = mode;
    document.getElementById("txnFormTitle").textContent = mode === "charge" ? "Add Charge" : "Record Payment";
    document.getElementById("t_amount").value = "";
    document.getElementById("t_description").value = "";
    document.getElementById("txnStatus").textContent = "";
    document.getElementById("txnFormCard").classList.remove("hidden");
  };

  window.saveTxn = async function () {
    const statusEl = document.getElementById("txnStatus");
    const amount = Number(document.getElementById("t_amount").value) || 0;
    const description = document.getElementById("t_description").value.trim();
    if (amount <= 0) { statusEl.textContent = "Enter an amount."; statusEl.style.color = "var(--danger)"; return; }

    try {
      statusEl.textContent = "Saving…"; statusEl.style.color = "var(--muted)";
      const wb = writeBatch(db);
      const txnRef = doc(collection(db, "credit_transactions"));
      wb.set(txnRef, {
        businessId: currentBusinessId, shopId: currentShopId, ownerUid: currentUser.uid,
        customerId: selectedCustomer.id, customerName: selectedCustomer.name,
        type: txnMode, amount, description,
        createdAt: serverTimestamp()
      });
      const newBalance = txnMode === "charge"
        ? selectedCustomer.balance + amount
        : selectedCustomer.balance - amount;
      wb.update(doc(db, "credit_accounts", selectedCustomer.id), { balance: newBalance });
      await wb.commit();

      selectedCustomer.balance = newBalance;
      statusEl.textContent = "Saved.";
      renderDetail();
      setTimeout(() => document.getElementById("txnFormCard").classList.add("hidden"), 500);
    } catch (err) {
      statusEl.textContent = "Failed: " + err.message;
      statusEl.style.color = "var(--danger)";
    }
  };

  function startTxnListener() {
    if (unsubTxns) unsubTxns();
    const q = query(collection(db, "credit_transactions"), where("ownerUid", "==", currentUser.uid), where("customerId", "==", selectedCustomer.id));
    unsubTxns = onSnapshot(q, (snap) => {
      const list = snap.docs.map(d => d.data()).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      const container = document.getElementById("txnList");
      if (list.length === 0) {
        container.innerHTML = '<div class="empty">No transactions yet.</div>';
        return;
      }
      container.innerHTML = list.map(t => {
        const dateStr = t.createdAt ? t.createdAt.toDate().toLocaleDateString() : "just now";
        const sign = t.type === "charge" ? "+" : "−";
        return `
          <div class="txn-row">
            <div>${t.description || (t.type === "charge" ? "Charge" : "Payment")}<br><span style="color:var(--muted); font-size:11px;">${dateStr}</span></div>
            <div class="txn-amt ${t.type}">${sign}${t.amount.toLocaleString()}</div>
          </div>`;
      }).join("");
    });
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    currentUser = user;
    const userSnap = await getDoc(doc(db, "users", user.uid));
    if (!userSnap.exists()) { window.location.href = "login.html"; return; }
    currentBusinessId = userSnap.data().businessId;

    const custQ = query(collection(db, "credit_accounts"), where("ownerUid", "==", user.uid));
    onSnapshot(custQ, { includeMetadataChanges: true }, (snap) => {
      const badge = document.getElementById("netBadge");
      const fromCache = snap.metadata.fromCache;
      badge.textContent = fromCache ? "offline (cached)" : "online (synced)";
      badge.className = "badge " + (fromCache ? "offline" : "online");
      allCustomers = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
      if (selectedCustomer) {
        const updated = allCustomers.find(c => c.id === selectedCustomer.id);
        if (updated) { selectedCustomer = updated; renderDetail(); }
      }
      renderCustList(document.getElementById("searchBox").value);
    });
  });
</script>
</body>
</html>
