<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediStock Cloud — Expenses</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --text:#e8e8ea; --muted:#9aa0aa;
    --accent:#3b82f6; --accent2:#22c55e; --danger:#ef4444; --border:#2a2e38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px; padding-bottom:40px;
  }
  h1{font-size:19px; margin:0;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; background:#1d2230; color:var(--muted);}
  .badge.online{color:var(--accent2);} .badge.offline{color:var(--danger);}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:14px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px;}
  input, select, textarea{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);
    background:#0d0f14; color:var(--text); font-size:14px; font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--accent);}
  .row{display:flex; gap:8px;} .row > *{flex:1;}
  button{border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff; width:100%; padding:12px; margin-top:12px;}
  .expense-item{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:10px 0; border-bottom:1px solid var(--border);
  }
  .expense-item:last-child{border-bottom:none;}
  .exp-cat{font-size:13px; font-weight:600;}
  .exp-desc{font-size:12px; color:var(--muted);}
  .exp-date{font-size:11px; color:var(--muted);}
  .exp-amt{font-size:14px; font-weight:700; white-space:nowrap; margin-left:10px;}
  .del-btn{background:transparent; color:var(--danger); border:1px solid var(--danger); padding:3px 8px; font-size:11px; margin-top:4px;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px 0;}
  .link{color:var(--accent); font-size:13px; text-decoration:none;}
  .total-line{font-size:15px; font-weight:700; margin-bottom:10px;}
</style>
</head>
<body>

<div class="topbar">
  <h1>Expenses</h1>
  <span class="badge" id="netBadge">checking…</span>
</div>

<div style="margin-bottom:12px;"><a class="link" href="inventory.html">← Inventory</a> &nbsp;·&nbsp; <a class="link" href="sales.html">Sell</a> &nbsp;·&nbsp; <a class="link" href="batches.html">Batches →</a></div>

<div class="card">
  <h2>Record Expense</h2>
  <label>Category</label>
  <select id="e_category">
    <option>Transport</option>
    <option>Rent</option>
    <option>Electricity</option>
    <option>Water</option>
    <option>Salaries</option>
    <option>Airtime</option>
    <option>Repairs</option>
    <option>Supplies</option>
    <option>Other</option>
  </select>

  <label>Amount</label>
  <input type="number" id="e_amount" min="0" placeholder="e.g. 15000">

  <label>Description (optional)</label>
  <textarea id="e_description" rows="2" placeholder="e.g. Boda fare to supplier"></textarea>

  <button class="btn-primary" onclick="saveExpense()">Save Expense</button>
  <div id="saveStatus" style="font-size:13px; margin-top:8px;"></div>
</div>

<div class="card">
  <div class="total-line" id="totalLine">Total this month: —</div>
  <h2>History</h2>
  <div id="expenseList"><div class="empty">Loading…</div></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, deleteDoc, collection, addDoc, onSnapshot,
    enableIndexedDbPersistence, serverTimestamp, query, where
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXwKfb9yg3HAQFIPG6q3SYHU9C7FQvkNY",
    authDomain: "medistock-cloud-93b83.firebaseapp.com",
    projectId: "medistock-cloud-93b83",
    storageBucket: "medistock-cloud-93b83.firebasestorage.app",
    messagingSenderId: "615610747921",
    appId: "1:615610747921:web:94b6627b64a250362335b0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  let currentUser = null;
  let currentBusinessId = null;
  let currentShopId = null;
  let allExpenses = [];

  window.saveExpense = async function () {
    const statusEl = document.getElementById("saveStatus");
    const category = document.getElementById("e_category").value;
    const amount = Number(document.getElementById("e_amount").value) || 0;
    const description = document.getElementById("e_description").value.trim();
    if (amount <= 0) { statusEl.textContent = "Enter an amount."; statusEl.style.color = "var(--danger)"; return; }

    try {
      statusEl.textContent = "Saving…"; statusEl.style.color = "var(--muted)";
      await addDoc(collection(db, "expenses"), {
        businessId: currentBusinessId,
        shopId: currentShopId,
        ownerUid: currentUser.uid,
        category, amount, description,
        createdAt: serverTimestamp()
      });
      statusEl.textContent = "Saved.";
      document.getElementById("e_amount").value = "";
      document.getElementById("e_description").value = "";
    } catch (err) {
      statusEl.textContent = "Failed: " + err.message;
      statusEl.style.color = "var(--danger)";
    }
  };

  window.deleteExpense = async function (id) {
    if (!confirm("Delete this expense?")) return;
    try { await deleteDoc(doc(db, "expenses", id)); }
    catch (err) { alert("Couldn't delete: " + err.message); }
  };

  function renderList() {
    const container = document.getElementById("expenseList");
    if (allExpenses.length === 0) {
      container.innerHTML = '<div class="empty">No expenses recorded yet.</div>';
      document.getElementById("totalLine").textContent = "Total this month: 0";
      return;
    }
    const now = new Date();
    const thisMonthTotal = allExpenses
      .filter(e => e.createdAt && e.createdAt.toDate().getMonth() === now.getMonth() && e.createdAt.toDate().getFullYear() === now.getFullYear())
      .reduce((sum, e) => sum + e.amount, 0);
    document.getElementById("totalLine").textContent = `Total this month: ${thisMonthTotal.toLocaleString()}`;

    container.innerHTML = allExpenses.map(e => {
      const dateStr = e.createdAt ? e.createdAt.toDate().toLocaleDateString() : "just now";
      return `
        <div class="expense-item">
          <div>
            <div class="exp-cat">${e.category}</div>
            ${e.description ? `<div class="exp-desc">${e.description}</div>` : ""}
            <div class="exp-date">${dateStr}</div>
            <button class="del-btn" onclick="deleteExpense('${e.id}')">Delete</button>
          </div>
          <div class="exp-amt">${e.amount.toLocaleString()}</div>
        </div>`;
    }).join("");
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    currentUser = user;
    const userSnap = await getDoc(doc(db, "users", user.uid));
    if (!userSnap.exists()) { window.location.href = "login.html"; return; }
    currentBusinessId = userSnap.data().businessId;

    const shopsQ = query(collection(db, "shops"), where("ownerUid", "==", user.uid));
    onSnapshot(shopsQ, (snap) => { if (!snap.empty) currentShopId = snap.docs[0].id; });

    const expensesQ = query(collection(db, "expenses"), where("ownerUid", "==", user.uid));
    onSnapshot(expensesQ, { includeMetadataChanges: true }, (snap) => {
      const badge = document.getElementById("netBadge");
      const fromCache = snap.metadata.fromCache;
      badge.textContent = fromCache ? "offline (cached)" : "online (synced)";
      badge.className = "badge " + (fromCache ? "offline" : "online");
      allExpenses = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      renderList();
    });
  });
</script>
</body>
</html>
