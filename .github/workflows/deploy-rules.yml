name: Publish Firestore rules (manual)
# Run by hand from the GitHub app/website: Actions > "Publish Firestore rules (manual)" > Run workflow.
# It repeats the emulator tests first and publishes ONLY if they pass. It publishes the WHOLE firestore.rules file from the repo (never a part).
# One-time setup (owner): add two repository secrets, FIREBASE_PROJECT_ID and FIREBASE_SERVICE_ACCOUNT (see docs/PUBLISH_RULES_FROM_PHONE.md).
on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to publish"
        type: choice
        default: rules
        options: [rules, indexes, rules-and-indexes]
jobs:
  test-then-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Offline tests
        run: node --test "tests/*.test.js"
      - name: Emulator rules tests (publishing stops here if any test fails)
        run: npm run test:rules
      - name: Check the secrets exist
        env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PID" ] || [ -z "$SA" ]; then echo "Missing secret FIREBASE_PROJECT_ID or FIREBASE_SERVICE_ACCOUNT. Nothing was published."; exit 1; fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Publish to Firebase
        env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
          WHAT: ${{ github.event.inputs.what }}
        run: |
          case "$WHAT" in
            rules) ONLY="firestore:rules" ;;
            indexes) ONLY="firestore:indexes" ;;
            *) ONLY="firestore:rules,firestore:indexes" ;;
          esac
          npx firebase deploy --only "$ONLY" --project "$PID" --non-interactive
          
