name: MediStock CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: JavaScript syntax check (all .js files)
        run: for f in *.js tests/*.js tests-emulator/*.js; do node --check "$f" || exit 1; done
      - name: Unit, contract, integration and regression-guard tests (no database needed)
        run: node --test "tests/*.test.js"
  rules:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Firestore security rules (Firebase Emulator)
        run: npm run test:rules
