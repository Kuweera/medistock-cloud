<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediStock Cloud — Batches</title>
<style>
  :root{
    --bg:#f4f7f5; --card:#ffffff; --text:#152420; --muted:#4b5f59;
    --accent:#0f6b5c; --accent2:#2e7d32; --warn:#c97a1f; --danger:#b23b3b; --border:#dbe4e0;
  }
  html[data-theme="dark"]{
    --bg:#0d1614; --card:#16211d; --text:#e7f2ee; --muted:#9fb6ae;
    --accent:#2bbfa0; --accent2:#4fd07a; --warn:#e2a53d; --danger:#e2685f; --border:#2a3934;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px; padding-bottom:40px;
  }
  h1{font-size:19px; margin:0;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; background:var(--border); color:var(--muted);}
  .badge.online{color:var(--accent2);} .badge.offline{color:var(--danger);}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:15px; margin:0 0 10px; color:var(--accent); font-weight:700;}
  label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px;}
  input, select{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:14px;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  .row{display:flex; gap:8px;} .row > *{flex:1;}
  button{border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff; width:100%; padding:12px; margin-top:12px;}
  .del-btn{background:transparent; color:var(--danger); border:1px solid var(--danger); padding:3px 8px; font-size:11px; margin-top:4px;}
  .batch-item{padding:10px 0; border-bottom:1px solid var(--border);}
  .batch-item:last-child{border-bottom:none;}
  .batch-drug{font-size:14px; font-weight:600;}
  .batch-meta{font-size:12px; color:var(--muted);}
  .tag{display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; margin-left:6px;}
  .tag.expired{background:rgba(239,68,68,.15); color:var(--danger);}
  .tag.soon{background:rgba(234,179,8,.15); color:var(--warn);}
  .tag.ok{background:rgba(34,197,94,.12); color:var(--accent2);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px 0;}
  .link{color:var(--accent); font-size:13px; text-decoration:none;}
  .alert-line{font-size:13px; padding:4px 0;}
  .filter-btns{display:flex; gap:6px; margin-bottom:10px;}
  .filter-btns button{flex:1; background:var(--card); color:var(--muted); border:1px solid var(--border); padding:8px; font-size:12px;}
  .filter-btns button.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  /* ===== Shared MediStock Cloud navigation (matches MediStock Pro) ===== */
  .app-header{
    position:sticky; top:0; z-index:20;
    background:var(--accent); color:#fff;
    margin:-16px -16px 14px; padding:16px 18px 14px;
  }
  .app-header h1{margin:0; font-size:19px; letter-spacing:.2px; font-weight:700; color:#fff;}
  .app-header p{margin:2px 0 0; font-size:12.5px; color:rgba(255,255,255,.75);}
  .nav-bar{
    position:sticky; top:0; z-index:25;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--accent); color:#fff;
    margin:-14px -16px 14px; padding:8px 6px; border-top:1px solid rgba(255,255,255,.15);
  }
  .hamburger-btn{
    background:none; border:none; color:#fff; font-size:22px; line-height:1;
    padding:8px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .nav-bar-brand{
    font-size:14px; font-weight:600; color:#fff; cursor:pointer;
    padding:8px 10px; -webkit-tap-highlight-color:transparent;
  }
  .nav-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:29;}
  .nav-overlay.visible{display:block;}
  .nav-panel{
    position:fixed; top:0; bottom:0; right:0; z-index:30;
    width:78%; max-width:300px;
    background:var(--accent);
    display:flex; flex-direction:column; gap:4px;
    padding:16px 10px; overflow-y:auto;
    transform:translateX(105%);
    transition:transform .22s ease;
    box-shadow:0 0 20px rgba(0,0,0,.3);
  }
  .nav-panel.open{transform:translateX(0);}
  .nav-panel-title{
    color:rgba(255,255,255,.75); font-size:12px; text-transform:uppercase; letter-spacing:.5px;
    margin:4px 6px 6px;
  }
  .nav-panel a{
    display:block; background:rgba(255,255,255,.1); color:#fff;
    border:1px solid rgba(255,255,255,.2); padding:12px 14px; margin-bottom:4px;
    border-radius:10px; font-size:14.5px; font-weight:600; text-align:left;
    text-decoration:none;
  }
  .nav-panel a.active{background:var(--card); color:var(--accent);}
  .nav-panel .theme-toggle{
    margin-top:10px; background:rgba(255,255,255,.1); color:#fff;
    border:1px solid rgba(255,255,255,.2); padding:10px 14px; border-radius:10px;
    font-size:13px; font-weight:600; cursor:pointer; text-align:left; width:100%;
  }
</style>
<script>
(function(){
  try{
    var pref = localStorage.getItem('mcThemePreference') || 'auto';
    var isDark = pref==='dark' || (pref==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  }catch(e){}
})();
</script>
</head>
<body>

<header class="app-header">
  <h1>MediStock Cloud</h1>
  <p>Multi-Shop Edition · Batches</p>
</header>
<div class="nav-bar">
  <button class="hamburger-btn" id="navToggle" aria-label="Menu" type="button">&#9776;</button>
  <div class="nav-bar-brand" onclick="location.href='dashboard.html'">🏠 Home</div>
  <span class="badge" id="netBadge">checking…</span>
</div>
<div class="nav-overlay" id="navOverlay"></div>
<nav class="nav-panel" id="navPanel">
  <div class="nav-panel-title">Menu</div>
  <a href="dashboard.html">Dashboard</a>
  <a href="sales.html">Sell</a>
  <a href="inventory.html">Inventory</a>
  <a href="purchases.html">Purchases</a>
  <a href="batches.html" class="active">Batches</a>
  <a href="stocktake.html">Stock Taking</a>
  <a href="whattobuy.html">What to Buy</a>
  <a href="expenses.html">Expenses</a>
  <a href="credit.html">Credit / Loans</a>
  <a href="suppliers.html">Suppliers</a>
  <a href="shops.html">Shops</a>
  <button type="button" class="theme-toggle" id="themeToggle">Theme</button>
</nav>
<div class="hint" id="shopIndicator" style="margin-bottom:8px; color:var(--muted);"></div>

<div class="card">
  <input type="text" id="searchBox" placeholder="Search drug name…" style="margin-bottom:10px;">
  <h2 style="margin-top:0;">Expiry Overview</h2>
  <div class="filter-btns">
    <button id="filter-all" class="active" onclick="setFilter('all')">All</button>
    <button id="filter-expired" onclick="setFilter('expired')">Expired</button>
    <button id="filter-soon" onclick="setFilter('soon')">Expiring ≤30d</button>
  </div>
  <div id="batchList"><div class="empty">Loading…</div></div>
</div>

<script>
  (function(){
    var toggle = document.getElementById('navToggle');
    var panel = document.getElementById('navPanel');
    var overlay = document.getElementById('navOverlay');
    function closeNav(){ panel.classList.remove('open'); overlay.classList.remove('visible'); }
    function openNav(){ panel.classList.add('open'); overlay.classList.add('visible'); }
    toggle && toggle.addEventListener('click', function(){
      panel.classList.contains('open') ? closeNav() : openNav();
    });
    overlay && overlay.addEventListener('click', closeNav);

    var themeBtn = document.getElementById('themeToggle');
    var order = ['auto','light','dark'];
    var labels = {auto:'\ud83c\udf13 Theme: Auto', light:'\u2600\ufe0f Theme: Light', dark:'\ud83c\udf19 Theme: Dark'};
    function applyPref(pref){
      var isDark = pref==='dark' || (pref==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      if (themeBtn) themeBtn.textContent = labels[pref];
    }
    var current = localStorage.getItem('mcThemePreference') || 'auto';
    applyPref(current);
    themeBtn && themeBtn.addEventListener('click', function(){
      current = order[(order.indexOf(current)+1) % order.length];
      localStorage.setItem('mcThemePreference', current);
      applyPref(current);
    });
  })();
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, getDocs, deleteDoc, writeBatch, collection, addDoc, onSnapshot,
    enableIndexedDbPersistence, serverTimestamp, query, where
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXwKfb9yg3HAQFIPG6q3SYHU9C7FQvkNY",
    authDomain: "medistock-cloud-93b83.firebaseapp.com",
    projectId: "medistock-cloud-93b83",
    storageBucket: "medistock-cloud-93b83.firebasestorage.app",
    messagingSenderId: "615610747921",
    appId: "1:615610747921:web:94b6627b64a250362335b0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  let currentUser = null;
  let cashierName = "";
  let currentBusinessId = null;
  let currentShopId = null;
  let allDrugs = [];
  let allBatches = [];
  let filter = "all";

  function daysUntil(dateStr) {
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr);
    return Math.round((target - today) / 86400000);
  }
  function expiryTag(dateStr) {
    const d = daysUntil(dateStr);
    if (d < 0) return { label: "EXPIRED", cls: "expired" };
    if (d <= 30) return { label: `${d}d left`, cls: "soon" };
    return { label: `${d}d left`, cls: "ok" };
  }

  // Never deletes the batch record — zeroes its remaining quantity and logs
  // a write-off transaction, same idea as Inventory's deactivate/reactivate:
  // keep the audit trail, don't erase history. Matches Pro's disposeBatch.
  window.writeOffBatch = async function (id) {
    const b = allBatches.find(x => x.id === id);
    if (!b || b.quantity <= 0) return;
    const drug = allDrugs.find(d => d.id === b.drugId);
    const reason = prompt(`Write off ${b.quantity} ${drug ? drug.baseUnit : "unit"}(s) of ${b.drugName} (batch ${b.batchNumber || "—"})?\n\nThis removes it from sellable stock permanently. Enter a reason (e.g. "Expired", "Damaged"):`, "Expired");
    if (reason === null) return;
    try {
      const wb = writeBatch(db);
      wb.update(doc(db, "batches", id), { quantity: 0 });
      if (drug) wb.update(doc(db, "drugs", b.drugId), { currentStockBase: Math.max(0, (drug.currentStockBase || 0) - b.quantity) });
      const txnRef = doc(collection(db, "stock_transactions"));
      wb.set(txnRef, {
        businessId: currentBusinessId, shopId: currentShopId,
        drugId: b.drugId, type: "WRITE_OFF", baseUnitsChange: -b.quantity,
        note: `Write-off — batch ${b.batchNumber || "—"} (${reason || "no reason given"})`,
        batchId: id, cashier: cashierName, createdAt: serverTimestamp()
      });
      await wb.commit();
    } catch (err) {
      alert("Couldn't write off: " + err.message);
    }
  };

  window.setFilter = function (f) {
    filter = f;
    ["all","expired","soon"].forEach(id => document.getElementById("filter-" + id).classList.toggle("active", id === f));
    renderList();
  };
  document.getElementById("searchBox").addEventListener("input", renderList);

  function renderList() {
    const container = document.getElementById("batchList");
    const q = document.getElementById("searchBox").value.toLowerCase();
    let list = allBatches.filter(b => b.quantity > 0); // depleted/written-off batches don't clutter this view
    if (q) list = list.filter(b => (b.drugName || "").toLowerCase().includes(q));
    list.sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate));
    if (filter === "expired") list = list.filter(b => daysUntil(b.expiryDate) < 0);
    if (filter === "soon") list = list.filter(b => { const d = daysUntil(b.expiryDate); return d >= 0 && d <= 30; });

    if (list.length === 0) {
      container.innerHTML = '<div class="empty">Nothing to show here.</div>';
      return;
    }
    container.innerHTML = list.map(b => {
      const tag = expiryTag(b.expiryDate);
      return `
        <div class="batch-item">
          <div class="batch-drug">${b.drugName}<span class="tag ${tag.cls}">${tag.label}</span></div>
          <div class="batch-meta">Batch ${b.batchNumber || "—"} · Qty ${b.quantity} · Exp ${b.expiryDate}${b.supplier ? " · " + b.supplier : ""}</div>
          <button class="del-btn" onclick="writeOffBatch('${b.id}')">Write off</button>
        </div>`;
    }).join("");
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    currentUser = user;
    const userSnap = await getDoc(doc(db, "users", user.uid));
    if (!userSnap.exists()) { window.location.href = "login.html"; return; }
    const profile = userSnap.data();
    currentBusinessId = profile.businessId;
    cashierName = profile.role === "owner" ? user.email : profile.name;

    if (profile.role === "owner") {
      const shopsSnap = await getDocs(query(collection(db, "shops"), where("businessId", "==", currentBusinessId)));
      const activeId = localStorage.getItem("mc_activeShopId");
      const foundShop = shopsSnap.docs.find(d => d.id === activeId);
      const resolvedShopDoc = foundShop || (shopsSnap.empty ? null : shopsSnap.docs[0]);
      currentShopId = resolvedShopDoc ? resolvedShopDoc.id : null;
      document.getElementById("shopIndicator").textContent = resolvedShopDoc
        ? `Working in: ${resolvedShopDoc.data().name}`
        : "No shop set up yet — go to Shops to add one.";
    } else {
      currentShopId = profile.shopId;
      const shopSnap = await getDoc(doc(db, "shops", currentShopId));
      document.getElementById("shopIndicator").textContent = shopSnap.exists() ? `Shop: ${shopSnap.data().name}` : "(unknown shop)";
    }
    if (!currentShopId) return;

    const drugsQ = query(collection(db, "drugs"), where("businessId", "==", currentBusinessId), where("shopId", "==", currentShopId));
    onSnapshot(drugsQ, (snap) => {
      allDrugs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
    });

    const batchesQ = query(collection(db, "batches"), where("businessId", "==", currentBusinessId), where("shopId", "==", currentShopId));
    onSnapshot(batchesQ, { includeMetadataChanges: true }, (snap) => {
      const badge = document.getElementById("netBadge");
      const fromCache = snap.metadata.fromCache;
      badge.textContent = fromCache ? "offline (cached)" : "online (synced)";
      badge.className = "badge " + (fromCache ? "offline" : "online");
      allBatches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderList();
    });
  });
</script>
</body>
</html>
