<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediStock Cloud — Batches</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --text:#e8e8ea; --muted:#9aa0aa;
    --accent:#3b82f6; --accent2:#22c55e; --warn:#eab308; --danger:#ef4444; --border:#2a2e38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px; padding-bottom:40px;
  }
  h1{font-size:19px; margin:0;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; background:#1d2230; color:var(--muted);}
  .badge.online{color:var(--accent2);} .badge.offline{color:var(--danger);}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:14px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  label{display:block; font-size:12px; color:var(--muted); margin:8px 0 3px;}
  input, select{
    width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);
    background:#0d0f14; color:var(--text); font-size:14px;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  .row{display:flex; gap:8px;} .row > *{flex:1;}
  button{border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff; width:100%; padding:12px; margin-top:12px;}
  .del-btn{background:transparent; color:var(--danger); border:1px solid var(--danger); padding:3px 8px; font-size:11px; margin-top:4px;}
  .batch-item{padding:10px 0; border-bottom:1px solid var(--border);}
  .batch-item:last-child{border-bottom:none;}
  .batch-drug{font-size:14px; font-weight:600;}
  .batch-meta{font-size:12px; color:var(--muted);}
  .tag{display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; margin-left:6px;}
  .tag.expired{background:rgba(239,68,68,.15); color:var(--danger);}
  .tag.soon{background:rgba(234,179,8,.15); color:var(--warn);}
  .tag.ok{background:rgba(34,197,94,.12); color:var(--accent2);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px 0;}
  .link{color:var(--accent); font-size:13px; text-decoration:none;}
  .alert-line{font-size:13px; padding:4px 0;}
  .filter-btns{display:flex; gap:6px; margin-bottom:10px;}
  .filter-btns button{flex:1; background:#0d0f14; color:var(--muted); border:1px solid var(--border); padding:8px; font-size:12px;}
  .filter-btns button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
</style>
</head>
<body>

<div class="topbar">
  <h1>Batches</h1>
  <span class="badge" id="netBadge">checking…</span>
</div>
<div class="alert-line" id="shopIndicator" style="margin-bottom:8px; color:var(--muted);"></div>

<div style="margin-bottom:12px;">
  <a class="link" href="inventory.html">← Inventory</a> &nbsp;·&nbsp;
  <a class="link" href="sales.html">Sell</a> &nbsp;·&nbsp;
  <a class="link" href="expenses.html">Expenses</a> &nbsp;·&nbsp;
  <a class="link" href="shops.html">Shops →</a> &nbsp;·&nbsp;
  <a class="link" href="dashboard.html">Dashboard →</a>
</div>

<div class="card">
  <h2>Add Batch</h2>
  <label>Drug</label>
  <select id="b_drug"></select>

  <div class="row">
    <div>
      <label>Batch number</label>
      <input type="text" id="b_batchNumber" placeholder="e.g. B2026-014">
    </div>
    <div>
      <label>Expiry date</label>
      <input type="date" id="b_expiryDate">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Quantity (base units)</label>
      <input type="number" id="b_quantity" min="0" placeholder="e.g. 500">
    </div>
    <div>
      <label>Purchase cost (total)</label>
      <input type="number" id="b_cost" min="0" placeholder="e.g. 45000">
    </div>
  </div>

  <button class="btn-primary" onclick="saveBatch()">Save Batch</button>
  <div id="saveStatus" style="font-size:13px; margin-top:8px;"></div>
  <div class="alert-line" style="color:var(--muted); margin-top:6px;">
    Adding a batch here increases the drug's total stock in Inventory automatically.
    Selling now takes from the earliest-expiring batch first, and won't sell from an expired one.
  </div>
</div>

<div class="card">
  <h2>Expiry Overview</h2>
  <div class="filter-btns">
    <button id="filter-all" class="active" onclick="setFilter('all')">All</button>
    <button id="filter-expired" onclick="setFilter('expired')">Expired</button>
    <button id="filter-soon" onclick="setFilter('soon')">Expiring ≤30d</button>
  </div>
  <div id="batchList"><div class="empty">Loading…</div></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, getDocs, deleteDoc, writeBatch, collection, addDoc, onSnapshot,
    enableIndexedDbPersistence, serverTimestamp, query, where
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXwKfb9yg3HAQFIPG6q3SYHU9C7FQvkNY",
    authDomain: "medistock-cloud-93b83.firebaseapp.com",
    projectId: "medistock-cloud-93b83",
    storageBucket: "medistock-cloud-93b83.firebasestorage.app",
    messagingSenderId: "615610747921",
    appId: "1:615610747921:web:94b6627b64a250362335b0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  let currentUser = null;
  let currentBusinessId = null;
  let currentShopId = null;
  let allDrugs = [];
  let allBatches = [];
  let filter = "all";

  function daysUntil(dateStr) {
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr);
    return Math.round((target - today) / 86400000);
  }
  function expiryTag(dateStr) {
    const d = daysUntil(dateStr);
    if (d < 0) return { label: "EXPIRED", cls: "expired" };
    if (d <= 30) return { label: `${d}d left`, cls: "soon" };
    return { label: `${d}d left`, cls: "ok" };
  }

  function populateDrugSelect() {
    const sel = document.getElementById("b_drug");
    const prev = sel.value;
    sel.innerHTML = allDrugs.map(d => `<option value="${d.id}">${d.name}</option>`).join("");
    if (prev) sel.value = prev;
  }

  window.saveBatch = async function () {
    const statusEl = document.getElementById("saveStatus");
    const drugId = document.getElementById("b_drug").value;
    const drug = allDrugs.find(d => d.id === drugId);
    const batchNumber = document.getElementById("b_batchNumber").value.trim();
    const expiryDate = document.getElementById("b_expiryDate").value;
    const quantity = Number(document.getElementById("b_quantity").value) || 0;
    const cost = Number(document.getElementById("b_cost").value) || 0;

    if (!drug || !expiryDate || quantity <= 0) {
      statusEl.textContent = "Pick a drug, expiry date, and quantity.";
      statusEl.style.color = "var(--danger)";
      return;
    }

    try {
      statusEl.textContent = "Saving…"; statusEl.style.color = "var(--muted)";
      const batchDocRef = doc(collection(db, "batches"));
      const wb = writeBatch(db);
      wb.set(batchDocRef, {
        businessId: currentBusinessId,
        shopId: currentShopId,
        ownerUid: currentUser.uid,
        drugId, drugName: drug.name,
        batchNumber, expiryDate, quantity, cost,
        createdAt: serverTimestamp()
      });
      wb.update(doc(db, "drugs", drugId), { currentStockBase: (drug.currentStockBase || 0) + quantity });
      await wb.commit();
      statusEl.textContent = "Saved — added to total stock too.";
      document.getElementById("b_batchNumber").value = "";
      document.getElementById("b_expiryDate").value = "";
      document.getElementById("b_quantity").value = "";
      document.getElementById("b_cost").value = "";
    } catch (err) {
      statusEl.textContent = "Failed: " + err.message;
      statusEl.style.color = "var(--danger)";
    }
  };

  window.deleteBatch = async function (id) {
    if (!confirm("Delete this batch record? This will also subtract its remaining quantity from the drug's total stock.")) return;
    const b = allBatches.find(x => x.id === id);
    if (!b) return;
    try {
      const drug = allDrugs.find(d => d.id === b.drugId);
      const wb = writeBatch(db);
      wb.delete(doc(db, "batches", id));
      if (drug) wb.update(doc(db, "drugs", b.drugId), { currentStockBase: Math.max(0, (drug.currentStockBase || 0) - b.quantity) });
      await wb.commit();
    } catch (err) {
      alert("Couldn't delete: " + err.message);
    }
  };

  window.setFilter = function (f) {
    filter = f;
    ["all","expired","soon"].forEach(id => document.getElementById("filter-" + id).classList.toggle("active", id === f));
    renderList();
  };

  function renderList() {
    const container = document.getElementById("batchList");
    let list = [...allBatches].sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate));
    if (filter === "expired") list = list.filter(b => daysUntil(b.expiryDate) < 0);
    if (filter === "soon") list = list.filter(b => { const d = daysUntil(b.expiryDate); return d >= 0 && d <= 30; });

    if (list.length === 0) {
      container.innerHTML = '<div class="empty">Nothing to show here.</div>';
      return;
    }
    container.innerHTML = list.map(b => {
      const tag = expiryTag(b.expiryDate);
      return `
        <div class="batch-item">
          <div class="batch-drug">${b.drugName}<span class="tag ${tag.cls}">${tag.label}</span></div>
          <div class="batch-meta">Batch ${b.batchNumber || "—"} · Qty ${b.quantity} · Exp ${b.expiryDate}</div>
          <button class="del-btn" onclick="deleteBatch('${b.id}')">Delete</button>
        </div>`;
    }).join("");
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    currentUser = user;
    const userSnap = await getDoc(doc(db, "users", user.uid));
    if (!userSnap.exists()) { window.location.href = "login.html"; return; }
    currentBusinessId = userSnap.data().businessId;

    const shopsSnap = await getDocs(query(collection(db, "shops"), where("ownerUid", "==", user.uid)));
    const activeId = localStorage.getItem("mc_activeShopId");
    const foundShop = shopsSnap.docs.find(d => d.id === activeId);
    const resolvedShopDoc = foundShop || (shopsSnap.empty ? null : shopsSnap.docs[0]);
    currentShopId = resolvedShopDoc ? resolvedShopDoc.id : null;
    document.getElementById("shopIndicator").textContent = resolvedShopDoc
      ? `Working in: ${resolvedShopDoc.data().name}`
      : "No shop set up yet — go to Shops to add one.";

    const drugsQ = query(collection(db, "drugs"), where("ownerUid", "==", user.uid), where("shopId", "==", currentShopId));
    onSnapshot(drugsQ, (snap) => {
      allDrugs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
      populateDrugSelect();
    });

    const batchesQ = query(collection(db, "batches"), where("ownerUid", "==", user.uid), where("shopId", "==", currentShopId));
    onSnapshot(batchesQ, { includeMetadataChanges: true }, (snap) => {
      const badge = document.getElementById("netBadge");
      const fromCache = snap.metadata.fromCache;
      badge.textContent = fromCache ? "offline (cached)" : "online (synced)";
      badge.className = "badge " + (fromCache ? "offline" : "online");
      allBatches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderList();
    });
  });
</script>
</body>
</html>
