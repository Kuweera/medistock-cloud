    { label: "TEST regimen small", medicine: "TESTmed", doseValue: 1, doseUnit: "tablet", route: "by mouth", frequency: { type: "daily", timesPerDay: 2, days: 3 }, maxWeightKg: 10 }] }));
  put("guidelines", "gl_d_v1", g("gl_d_v1", "d", 1, { title: "TEST draft delta", approvalStatus: "draft" }));
  put("guidelines", "gl_z_v1", g("gl_z_v1", "z", 1, { title: "TEST unrelated zulu", symptoms: ["testrash"], investigations: [] }));
  put("guidelines", "gl_p_v1", g("gl_p_v1", "p", 1, { title: "TEST adult-only papa", symptoms: ["testcough"], applicability: { minAgeMonths: 216, sex: "any", pregnancy: "any" } }));

    add: function (c, id, d) { put(c, id, d); notifyAll(); } };

    store.forEach(function (v, k) { var i = k.indexOf("/"), c = k.slice(0, i), id = k.slice(i + 1); if (c !== q.coll) return; for (var j = 0; j < q.wheres.length; j++) if (v[q.wheres[j].f] !== q.wheres[j].v) return;

  }

    writeBatch: function () { var ops = []; var w = {}; w.set = function (r, d) { ops.push(["set", r, d]); return w; }; w.update = function (r, d) { ops.push(["update", r, d]); return w; };

        var deny = function (why) { var e = new Error("Missing or insufficient permissions. (" + why + ")"); e.code = "permission-denied"; window.__denied = (window.__denied || []).concat([why]); return Promise.reject(e); };

        for (var i = 0; i < ops.length; i++) {
          var o = ops[i], r = o[1], d = o[2];

            var ord = inBatch("pc_treatment_orders", r.id);
            if (!ord || ord[2].status !== "active" || ["medicine", "consumable"].indexOf(ord[2].kind) < 0) return deny("prescription create needs its active medicine or consumable order in the same batch");
            if (!(d.id === r.id && d.orderId === r.id && d.status === "pending" && d.qtyDispensed === 0 && typeof d.qtyPrescribed === "number" && d.qtyPrescribed >= 0 && (d.qtyPrescribed > 0 || d.qtyUnknown === true) && d.patientId === ord[2].patientId && d.prescriberId === "owner1")) return deny("prescription create shape");
          } else {
            var cur = store.get(r.path);
            if (!cur) return deny("update of a missing prescription");
            var okKeys = ["status", "endedAt", "endedBy", "endReason", "supersededBy", "updatedBy", "updatedAt"];
            if (window.__denyRxUpdate) return deny("pharmacy started dispensing (simulated)");
            if (["cancelled", "superseded"].indexOf(d.status) < 0 || cur.status !== "pending" || cur.qtyDispensed !== 0) return deny("prescription update only pending, nothing dispensed");
            if (Object.keys(d).some(function (k) { return okKeys.indexOf(k) < 0; })) return deny("prescription update keys: " + Object.keys(d).join(","));

        for (var k = 0; k < ops.length; k++) {

          if (q[1].coll === "pc_treatment_events") { var oc = inBatch("pc_treatment_orders", q[2].orderId); var odc = oc ? oc[2] : store.get("pc_treatment_orders/" + q[2].orderId); if (odc && odc.kind === "consumable") return deny("v23 consumables have no dose events"); }
